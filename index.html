<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyDesk שיבוץ v7</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f0f4f8;--s:#fff;--s2:#f8fafc;--s3:#eef2f7;
  --b:#e2e8f0;--b2:#cbd5e1;
  --acc:#2563eb;--al:#eff6ff;
  --grn:#16a34a;--gl:#dcfce7;
  --amb:#d97706;--aml:#fef3c7;
  --red:#dc2626;--rl:#fee2e2;
  --pur:#7c3aed;--pl:#ede9fe;
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --r:10px;--rsm:6px;--rlg:16px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shm:0 4px 14px rgba(0,0,0,.1);
  --shl:0 20px 40px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--tx);direction:rtl;height:100vh;overflow:hidden;font-size:13px;}

/* LOGIN */
#ls{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb 50%,#7c3aed);display:flex;align-items:center;justify-content:center;z-index:9999;}
.lcard{background:#fff;border-radius:20px;padding:36px 40px;width:360px;box-shadow:var(--shl);text-align:center;}
.lhero{margin-bottom:22px;}
.lhero h1{font-size:32px;font-weight:900;color:#fff;letter-spacing:-1px;margin-bottom:8px;}
.lhero h1 span{color:#93c5fd;}
.lhero p{color:#93c5fd;font-size:13px;}
.lcard h2{font-size:17px;font-weight:700;margin-bottom:3px;text-align:right;}
.lcard p{color:var(--tx3);font-size:12px;margin-bottom:20px;text-align:right;}
.lf{margin-bottom:12px;text-align:right;}
.lf label{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px;}
.lf select,.lf input{width:100%;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:9px 12px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;background:#fff;}
.lf select:focus,.lf input:focus{outline:none;border-color:var(--acc);}
.lerr{color:var(--red);font-size:11px;margin-top:4px;display:none;}
.lbtn{width:100%;background:var(--acc);border:none;border-radius:var(--rsm);padding:11px;color:#fff;font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}
.lbtn:hover{background:#1d4ed8;}

/* APP SHELL */
.app{display:grid;grid-template-rows:52px 1fr;height:100vh;}
.top{background:var(--s);border-bottom:1.5px solid var(--b);padding:0 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);flex-shrink:0;}
.logo{font-size:15px;font-weight:900;flex:none;}.logo span{color:var(--acc);}
.sep{width:1px;height:20px;background:var(--b2);flex:none;}
.tabs{display:flex;gap:1px;background:var(--s2);padding:3px;border-radius:8px;}
.tab{padding:4px 11px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--tx2);font-family:'Heebo',sans-serif;}
.tab.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:var(--sh);}
.wnav{display:flex;align-items:center;gap:5px;margin-right:auto;}
.wb{background:var(--s2);border:1.5px solid var(--b);color:var(--tx2);border-radius:var(--rsm);padding:4px 9px;cursor:pointer;font-size:12px;font-weight:600;}
.wb:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}
.wl{font-size:13px;font-weight:600;min-width:125px;text-align:center;}
.tbtn{background:var(--s2);border:1.5px solid var(--b);color:var(--tx2);border-radius:var(--rsm);padding:4px 10px;cursor:pointer;font-size:11px;font-family:'Heebo',sans-serif;font-weight:500;white-space:nowrap;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}
.tbtn.g{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}
.tbtn.g:hover{background:#1d4ed8;}
.tbtn.gr{background:var(--grn);border-color:var(--grn);color:#fff;font-weight:700;}
.upill{display:flex;align-items:center;gap:5px;background:var(--s2);border:1.5px solid var(--b);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;}
.udot{width:7px;height:7px;border-radius:50%;background:var(--grn);}
.badge{border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;}
.ba{background:var(--pl);color:var(--pur);border:1px solid #c4b5fd;}
.bp{background:var(--al);color:var(--acc);border:1px solid #bfdbfe;}

/* BODY */
.body{display:grid;grid-template-columns:268px 1fr;overflow:hidden;}
.sb{background:var(--s);border-left:1.5px solid var(--b);display:flex;flex-direction:column;overflow:hidden;}
.sbh{padding:9px 12px;font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:.07em;text-transform:uppercase;border-bottom:1.5px solid var(--b);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--s2);}
.sbh button{background:var(--acc);border:none;border-radius:5px;padding:3px 9px;font-size:11px;color:#fff;cursor:pointer;font-family:'Heebo',sans-serif;font-weight:700;}
.rscroll{overflow-y:auto;flex:1;padding:7px;}
.rscroll::-webkit-scrollbar{width:4px;}
.rscroll::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}

/* REQUEST CARDS */
.rcard{border-radius:var(--r);padding:9px 11px;margin-bottom:7px;cursor:grab;border:1.5px solid;user-select:none;transition:box-shadow .12s,transform .1s;background:#fff;}
.rcard:hover{box-shadow:var(--shm);transform:translateY(-1px);}
.rcard.dragging{opacity:.4;}
.rc-stripe{height:3px;border-radius:2px;margin-bottom:7px;}
.rc-type{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;}
.rc-proj{font-weight:700;font-size:12px;line-height:1.3;margin-bottom:2px;}
.rc-meta{font-size:10px;color:var(--tx2);line-height:1.7;}
.rbtns{display:flex;gap:3px;margin-top:6px;}
.rbtn{background:var(--s2);border:1px solid var(--b);border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;color:var(--tx2);font-family:'Heebo',sans-serif;}
.rbtn:hover{background:var(--al);color:var(--acc);border-color:var(--acc);}
.rbtn.del{color:var(--red);}
.schip{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid;}
.s-open{background:#eff6ff;color:#2563eb;border-color:#bfdbfe;}
.s-partial{background:#fef3c7;color:#d97706;border-color:#fcd34d;}
.s-done{background:#dcfce7;color:#16a34a;border-color:#86efac;}

/* TYPES */
.T-t{--tc:#2563eb;--tl:#eff6ff;--tb:#bfdbfe;}
.T-m{--tc:#64748b;--tl:#f8fafc;--tb:#cbd5e1;}
.T-z{--tc:#d97706;--tl:#fef3c7;--tb:#fcd34d;}
.T-w{--tc:#16a34a;--tl:#dcfce7;--tb:#86efac;}
.T-r{--tc:#dc2626;--tl:#fee2e2;--tb:#fca5a5;}
.T-p{--tc:#7c3aed;--tl:#ede9fe;--tb:#c4b5fd;}

/* MATRIX */
.main{overflow:hidden;display:flex;flex-direction:column;padding:10px 12px;gap:8px;}
.legbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);font-weight:500;}
.ldot{width:10px;height:10px;border-radius:3px;}
.mwrap{flex:1;background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);overflow:auto;box-shadow:var(--sh);}
.mwrap::-webkit-scrollbar{width:5px;height:5px;}
.mwrap::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px;}
table{border-collapse:collapse;width:100%;table-layout:fixed;}
th{font-size:10px;font-weight:700;color:var(--tx2);text-align:center;padding:8px 3px;background:var(--s2);border:1.5px solid var(--b);position:sticky;top:0;z-index:5;white-space:nowrap;}
th.icol{text-align:right;padding-right:8px;width:100px;background:var(--s3);}
th.dcol{width:calc((100% - 100px)/6);}
.dh-n{font-size:12px;font-weight:800;color:var(--tx);display:block;}
.dh-s{font-size:10px;color:var(--tx3);display:block;}
th.today-h{background:var(--al)!important;}
th.today-h .dh-n{color:var(--acc);}
td.icell{border:1.5px solid var(--b);padding:6px 8px;background:var(--s2);vertical-align:middle;}
.irow{display:flex;align-items:center;gap:6px;}
.iav{width:26px;height:26px;border-radius:50%;background:var(--al);color:var(--acc);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid #bfdbfe;}
.iname{font-size:12px;font-weight:700;}
.icity{font-size:9px;color:var(--tx3);}
td.dcell{border:1.5px solid var(--b);padding:3px;vertical-align:top;min-height:66px;transition:background .08s;position:relative;}
td.dcell.today-c{background:#f0f7ff;}
td.dcell.dov{background:var(--al);border-color:var(--acc);}
td.dcell.off-day{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 4px,#eef2f7 4px,#eef2f7 8px);}
.off-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:700;color:var(--tx3);text-align:center;white-space:nowrap;}
.cinn{min-height:60px;display:flex;flex-direction:column;gap:2px;}
.chip{border-radius:6px;padding:4px 6px;border:1.5px solid;cursor:pointer;}
.chip-p{font-size:11px;font-weight:700;display:block;line-height:1.3;color:var(--tc);}
.chip-t{font-size:9px;display:block;color:var(--tc);opacity:.8;font-weight:600;}
.chip-d{font-size:9px;display:block;color:var(--tx3);}
.chip-acts{display:none;gap:2px;margin-top:3px;}
.chip:hover .chip-acts{display:flex;}
.chbtn{background:rgba(0,0,0,.06);border:none;border-radius:3px;padding:2px 5px;font-size:9px;cursor:pointer;color:var(--tc);font-family:'Heebo',sans-serif;font-weight:600;}
.chbtn:hover{background:rgba(0,0,0,.12);}
.addcell{border:1.5px dashed var(--b2);background:transparent;border-radius:6px;padding:3px;width:100%;cursor:pointer;color:var(--tx3);font-size:12px;text-align:center;transition:all .12s;font-family:'Heebo',sans-serif;margin-top:1px;}
.addcell:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}
.addcell.dreshot-btn{border-color:var(--grn);color:var(--grn);}
.addcell.dreshot-btn:hover{background:var(--gl);}

/* INSTALLER VIEW */
.inst-view{display:grid;grid-template-columns:1fr 320px;gap:10px;height:100%;overflow:hidden;}
.inst-cal{overflow:auto;background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);}
.inst-cal::-webkit-scrollbar{width:5px;}
.inst-cal::-webkit-scrollbar-thumb{background:var(--b2);}
.inst-detail{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);overflow-y:auto;box-shadow:var(--sh);padding:14px;}
.inst-detail::-webkit-scrollbar{width:4px;}
.inst-detail::-webkit-scrollbar-thumb{background:var(--b2);}
.inst-week-header{display:grid;grid-template-columns:90px repeat(6,1fr);background:var(--s2);border-bottom:1.5px solid var(--b);position:sticky;top:0;z-index:3;}
.iwh-cell{padding:8px 4px;text-align:center;font-size:10px;font-weight:700;color:var(--tx2);border-left:1px solid var(--b);}
.iwh-cell:first-child{border-left:none;text-align:right;padding-right:8px;}
.iwh-cell.today{background:var(--al);color:var(--acc);}
.inst-row{display:grid;grid-template-columns:90px repeat(6,1fr);border-bottom:1px solid var(--b);}
.inst-row:last-child{border-bottom:none;}
.inst-name-cell{padding:8px;background:var(--s2);border-left:1px solid var(--b);display:flex;align-items:center;gap:6px;min-height:70px;}
.inst-day-cell{border-left:1px solid var(--b);padding:3px;min-height:70px;position:relative;transition:background .08s;}
.inst-day-cell.off{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 4px,#f0f4f8 4px,#f0f4f8 8px);}
.inst-day-cell.today-inst{background:#f0f7ff;}
.inst-day-cell.dov{background:var(--al);outline:2px solid var(--acc);}
.inst-mini-chip{border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;margin-bottom:2px;cursor:pointer;border:1px solid;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inst-add{width:100%;border:1px dashed var(--b2);background:transparent;border-radius:4px;padding:2px;font-size:12px;cursor:pointer;color:var(--tx3);text-align:center;margin-top:2px;}
.inst-add:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}
.off-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9px;color:var(--tx3);font-weight:600;white-space:nowrap;}
.detail-title{font-size:13px;font-weight:800;color:var(--tx);margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px solid var(--b);display:flex;align-items:center;gap:8px;}
.detail-section{margin-bottom:14px;}
.detail-section-title{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.detail-task{background:var(--s2);border:1.5px solid var(--b);border-radius:var(--rsm);padding:8px 10px;margin-bottom:6px;border-right:3px solid var(--tc,var(--acc));}
.detail-task-name{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:3px;}
.detail-task-meta{font-size:10px;color:var(--tx2);line-height:1.7;}
.detail-file{display:flex;align-items:center;gap:6px;background:var(--al);border:1px solid #bfdbfe;border-radius:var(--rsm);padding:6px 10px;cursor:pointer;font-size:11px;color:var(--acc);font-weight:600;margin-top:4px;}
.detail-file:hover{background:#dbeafe;}
.no-tasks{color:var(--tx3);font-size:12px;text-align:center;padding:20px;}

/* DRESHOT VIEW */
.dview{overflow-y:auto;height:100%;padding-bottom:20px;}
.dg-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px;display:flex;align-items:center;gap:8px;}
.dg-title::after{content:'';flex:1;height:1px;background:var(--b);}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:8px;margin-bottom:6px;}
.dcard{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);transition:box-shadow .15s,transform .1s;position:relative;overflow:hidden;}
.dcard::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--tc,var(--acc));}
.dcard:hover{box-shadow:var(--shm);transform:translateY(-2px);}
.dc-type{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;}
.dc-proj{font-size:13px;font-weight:700;margin-bottom:6px;line-height:1.3;}
.dc-meta{font-size:11px;color:var(--tx2);line-height:1.7;margin-bottom:8px;}
.dc-btns{display:flex;gap:5px;flex-wrap:wrap;}
.dbtn{background:var(--s2);border:1.5px solid var(--b);border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--tx2);font-family:'Heebo',sans-serif;font-weight:600;transition:all .12s;}
.dbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}
.dbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff;}
.dbtn.del{color:var(--red);}
.dbtn.del:hover{background:var(--rl);border-color:var(--red);}

/* INSTALLER MGMT */
.inst-mgmt{overflow-y:auto;height:100%;padding-bottom:20px;}
.inst-mgmt::-webkit-scrollbar{width:5px;}
.inst-mgmt::-webkit-scrollbar-thumb{background:var(--b2);}
.inst-card{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;}
.inst-card-left{display:flex;align-items:center;gap:12px;}
.inst-card-av{width:38px;height:38px;border-radius:50%;background:var(--al);color:var(--acc);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #bfdbfe;}
.inst-card-info .iname{font-size:13px;font-weight:700;}
.inst-card-info .imeta{font-size:11px;color:var(--tx2);margin-top:2px;}
.inst-card-right{display:flex;gap:6px;}
.inst-stats{display:flex;gap:12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--b);}
.inst-stat{text-align:center;}
.inst-stat-v{font-size:16px;font-weight:800;color:var(--tx);}
.inst-stat-l{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;}

/* STATS */
.stats-area{overflow-y:auto;height:100%;padding-bottom:20px;}
.stats-area::-webkit-scrollbar{width:5px;}
.stats-area::-webkit-scrollbar-thumb{background:var(--b2);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.kpi{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;bottom:0;right:0;left:0;height:3px;background:var(--kc,var(--acc));}
.kpi-l{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.kpi-v{font-size:28px;font-weight:900;line-height:1;}
.kpi-s{font-size:10px;color:var(--tx3);margin-top:3px;}
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.cc{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:14px;box-shadow:var(--sh);}
.cc-t{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.br{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.bn{font-size:11px;color:var(--tx2);width:90px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.bt{flex:1;height:9px;background:var(--s2);border-radius:5px;overflow:hidden;}
.bf{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bv{font-size:11px;color:var(--tx3);width:22px;text-align:left;font-weight:600;}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.ov.open{display:flex;}
.modal{background:var(--s);border:1.5px solid var(--b);border-radius:var(--rlg);padding:22px 24px;width:440px;max-height:90vh;overflow-y:auto;box-shadow:var(--shl);}
.modal::-webkit-scrollbar{width:4px;}
.modal::-webkit-scrollbar-thumb{background:var(--b2);}
.modal h3{font-size:15px;font-weight:800;margin-bottom:16px;}
.mf{margin-bottom:11px;}
.mf label{font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px;}
.mf select,.mf input,.mf textarea{width:100%;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:8px 11px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;background:#fff;}
.mf select:focus,.mf input:focus,.mf textarea:focus{outline:none;border-color:var(--acc);}
.mf textarea{resize:vertical;min-height:60px;}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.msep{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:10px 0 6px;border-top:1px solid var(--b);margin-top:4px;}
.file-area{border:2px dashed var(--b2);border-radius:var(--rsm);padding:12px;text-align:center;cursor:pointer;transition:all .15s;}
.file-area:hover{border-color:var(--acc);background:var(--al);}
.file-area input{display:none;}
.file-area p{font-size:12px;color:var(--tx3);}
.file-prev{display:flex;align-items:center;gap:8px;background:var(--al);border:1px solid #bfdbfe;border-radius:var(--rsm);padding:7px 10px;margin-top:6px;}
.file-prev span{font-size:11px;color:var(--acc);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.file-prev button{background:none;border:none;cursor:pointer;color:var(--red);font-size:14px;line-height:1;}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1.5px solid var(--b);}

.ich:hover{background:var(--al);}

.cal-send{overflow-x:auto;background:var(--s2);border:1.5px solid var(--b);border-radius:var(--rsm);padding:6px;}
.cal-tbl{border-collapse:collapse;width:100%;min-width:560px;}

.cal-chip-s{display:block;border-radius:3px;padding:2px 5px;font-size:9px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.prevbox{background:var(--s2);border:1.5px solid var(--b);border-radius:var(--rsm);padding:10px 12px;font-size:11px;line-height:1.8;max-height:150px;overflow-y:auto;white-space:pre-wrap;font-family:'Heebo',sans-serif;color:var(--tx);}
.sbtns{display:flex;gap:8px;margin-top:12px;}
.sbtn{flex:1;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:9px;cursor:pointer;font-size:12px;font-family:'Heebo',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}

.sbtn.cp:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}

/* LOADER + NOTIF */
#ldr{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:800;align-items:center;justify-content:center;flex-direction:column;gap:12px;backdrop-filter:blur(2px);}
#ldr.show{display:flex;}
.spin{width:36px;height:36px;border:3px solid var(--b2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s);border:1.5px solid var(--b);border-radius:10px;padding:10px 22px;font-size:12px;font-weight:700;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:var(--shm);white-space:nowrap;}
.notif.show{opacity:1;}
.notif.ok{border-color:#86efac;color:var(--grn);}
.notif.err{border-color:#fca5a5;color:var(--red);}

// ═══ STORAGE ════════════════════════════════════════════════
function save(){
  try{localStorage.setItem('mds7',JSON.stringify({chips,dreshyot,installers,offDays,nid}));}
  catch(e){console.warn('Storage full',e);}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('mds7')||'{}');
    if(d.chips)chips=d.chips;
    if(d.dreshyot)dreshyot=d.dreshyot;
    if(d.installers)installers=d.installers;
    if(d.offDays)offDays=d.offDays;
    if(d.nid)nid=d.nid;
  }catch(e){}
}

// ═══ UTILS ══════════════════════════════════════════════════
function notify(m,dur=2500,t=''){
  const el=document.getElementById('notif');
  el.textContent=m;el.className='notif show'+(t?' '+t:'');
  setTimeout(()=>el.className='notif',dur);
}
function wd(off){
  const b=new Date(2026,4,18);const d0=new Date(b);d0.setDate(b.getDate()+off*7);
  return Array.from({length:6},(_,i)=>{const d=new Date(d0);d.setDate(d0.getDate()+i);return d;});
}
function fmt(d){return d.getDate()+'/'+(d.getMonth()+1);}
function isToday(d){const n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}
function isoD(d){return d.toISOString().split('T')[0];}
function cw(d){wk+=d;render();}
function gt(){wk=0;render();}
function ck(inst,di){return inst+'__'+di+'__'+wk;}
function offKey(inst,d){return inst+'__'+isoD(d);}
function isOff(inst,d){return !!offDays[offKey(inst,d)];}
function allC(){
  return Object.entries(chips).flatMap(([k,arr])=>{
    const[i,di,w]=k.split('__');return arr.map(c=>({...c,inst:i,di:+di,wk:+w}));
  });
}

function hFile(input,prevId,nameId){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const id='f'+nid++;
    fileStore[id]={name:f.name,dataUrl:e.target.result,type:f.type};
    input.dataset.fid=id;
    document.getElementById(prevId).style.display='flex';
    document.getElementById(nameId).textContent=f.name;
  };
  r.readAsDataURL(f);
}
function clrFile(inputId,prevId){
  document.getElementById(inputId).value='';
  document.getElementById(inputId).dataset.fid='';
  document.getElementById(prevId).style.display='none';
}

function openFile(fid){
  const f=fileStore[fid];if(!f)return;
  const a=document.createElement('a');a.href=f.dataUrl;a.download=f.name;a.click();
}

function dDrag(e,id){dragSrc={t:'d',id};e.dataTransfer.effectAllowed='move';}
function cDrag(e,k,ci){dragSrc={t:'c',k,ci};e.dataTransfer.effectAllowed='move';}
function cOver(e,key){
  e.preventDefault();
  document.querySelectorAll('.dcell,.inst-day-cell').forEach(c=>c.classList.remove('dov'));
  document.querySelector(`[data-key="${key}"]`)?.classList.add('dov');
}
function cDrop(e,key){
  e.preventDefault();
  document.querySelectorAll('.dcell,.inst-day-cell').forEach(c=>c.classList.remove('dov'));
  if(!dragSrc)return;
  const dates=wd(wk);const di=+key.split('__')[1];const dayDate=isoD(dates[di]);
  if(dragSrc.t==='d'){
    const d=dreshyot.find(x=>x.id===dragSrc.id);
    if(d){
      if(!chips[key])chips[key]=[];
      chips[key].push({id:'c'+nid++,project:d.project,type:d.type,qty:d.qty||1,
        insts:[key.split('__')[0]],installer:key.split('__')[0],
        pm:d.pm||CU,days:d.days,date:dayDate,
        addr:d.addr,contact:d.contact,cphone:d.cphone,notes:d.notes,fileId:d.fileId});
      d.status='שובץ חלקית';
    }
  }else if(dragSrc.t==='c'){
    if(dragSrc.k===key){dragSrc=null;return;}
    const c=chips[dragSrc.k]?.[dragSrc.ci];
    if(c){chips[dragSrc.k].splice(dragSrc.ci,1);if(!chips[key])chips[key]=[];chips[key].push({...c,date:dayDate});}
  }
  dragSrc=null;save();render();
}
function dq(e){
  e.preventDefault();
  if(!dragSrc||dragSrc.t!=='c')return;
  const c=chips[dragSrc.k]?.[dragSrc.ci];
  if(c){chips[dragSrc.k].splice(dragSrc.ci,1);dreshyot.unshift({id:'d'+nid++,project:c.project,type:c.type,qty:1,days:c.days,date:c.date,addr:c.addr,contact:c.contact,cphone:c.cphone,notes:c.notes,fileId:c.fileId,status:'פתוח',pm:c.pm});}
  dragSrc=null;save();render();
}

      +'</div></div>';
  }

function buildSend(single){
  const dates=wd(wk);
  const sel=document.getElementById('ssel');
  const tgts=single&&sel?[sel.value]:installers.map(i=>i.name).filter(n=>{const cb=document.getElementById('sc-'+n);return cb&&cb.checked;});

  // Calendar
  const cal=document.getElementById('cal-preview');
  let ch=`<table class="cal-tbl"><thead><tr><th class="ith">מתקין</th>
    ${DAYS.map((d,i)=>`<th style="${isToday(dates[i])?'color:var(--acc);background:var(--al);':''}">${d}<br><span style="font-weight:400;font-size:9px;">${fmt(dates[i])}</span></th>`).join('')}
  </tr></thead><tbody>`;
  tgts.forEach(nm=>{
    const av=nm.replace(/\s/g,'').slice(0,2);
    ch+=`<tr><td class="itd"><div style="display:flex;align-items:center;gap:5px;"><div style="width:22px;height:22px;border-radius:50%;background:var(--al);color:var(--acc);font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${av}</div><div><div style="font-size:11px;font-weight:700;">${nm}</div><div style="font-size:9px;color:var(--tx3);">${installers.find(i=>i.name===nm)?.phone||''}</div></div></div></td>`;
    for(let di=0;di<6;di++){
      const k=ck(nm,di);const cs=chips[k]||[];const off=isOff(nm,dates[di]);
      ch+=`<td class="${isToday(dates[di])?'cal-today':''}${off?' off-day':''}">`;
      if(off){ch+=`<span style="font-size:9px;color:var(--tx3);display:flex;align-items:center;justify-content:center;height:100%;font-weight:700;">${offDays[offKey(nm,dates[di])]||'חופש'}</span>`;}
      else{cs.forEach(c=>{ch+=`<span class="cal-chip-s" style="background:${TC[c.type]}18;border:1px solid ${TC[c.type]}40;color:${TC[c.type]};">${c.project.length>14?c.project.slice(0,13)+'…':c.project}</span>`;});}
      ch+='</td>';
    }
    ch+='</tr>';
  });
  ch+='</tbody></table>';
  cal.innerHTML=ch;

  // Text
  let txt=`*סידור עבודה – שבוע ${fmt(dates[0])} – ${fmt(dates[5])}*
${'━'.repeat(28)}
`;
  let any=false;
  tgts.forEach(nm=>{
    const inst=installers.find(i=>i.name===nm);
    const rows=[];
    DAYS.forEach((day,di)=>{
      const cs=chips[ck(nm,di)]||[];const off=isOff(nm,dates[di]);
      if(off){rows.push(`
  *${day} ${fmt(dates[di])}* – 🔴 ${offDays[offKey(nm,dates[di])]||'חופש'}`);}
      else if(cs.length){
        rows.push(`
  *${day} ${fmt(dates[di])}*`);
        cs.forEach(c=>{
          rows.push(`  • ${c.project} – ${TL[c.type]||c.type}${c.days>1?', '+c.days+' ימים':''}`);
          if(c.pm)rows.push(`    👤 מנהל פרויקט: ${c.pm}`);
          if(c.addr)rows.push(`    📍 ${c.addr}`);
          if(c.contact||c.cphone)rows.push(`    👤 ${c.contact||''} ${c.cphone||''}`);
          if(c.notes)rows.push(`    📝 ${c.notes}`);
          if(c.fileId&&fileStore[c.fileId])rows.push(`    📎 ${fileStore[c.fileId].name} (מצורף)`);
        });
      }
    });
    if(rows.length){txt+=`
🔧 *${nm}*${inst?.phone?' | '+inst.phone:''}${rows.join('
')}
`;any=true;}
  });
  if(!any)txt+='
(אין שיבוצים בשבוע זה)';
  document.getElementById('prevbox').textContent=txt;
}
function sendWA(){
  const txt=document.getElementById('prevbox').textContent;
  const sel=document.getElementById('ssel');
  if(sel){
    const inst=installers.find(i=>i.name===sel.value);
    const ph=(inst?.phone||'').replace(/\D/g,'').replace(/^0/,'972');
    window.open(ph?`https://wa.me/${ph}?text=${encodeURIComponent(txt)}`:`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');
  }else{window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');}
}
function sendCopy(){
  navigator.clipboard.writeText(document.getElementById('prevbox').textContent)
    .then(()=>notify('הועתק ✓',2000,'ok')).catch(()=>notify('סמן ידנית'));
}

// ═══ VIEWS ═══════════════════════════════════════════════════
function sv(v){
  view=v;
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',['schedule','installer','dreshot','stats'][i]===v));
  render();
}
function render(){
  const dates=wd(wk);
  document.getElementById('wl').textContent=fmt(dates[0])+' – '+fmt(dates[5]);
  renderSB();
  if(view==='schedule')renderSchedule(dates);
  else if(view==='installer')renderInstView(dates);
  else if(view==='dreshot')renderDreshot();
  else renderStats(dates);
}

// SIDEBAR
function renderSB(){
  const vis=isA?dreshyot:dreshyot.filter(d=>d.pm===CU||!d.pm);
  const open=vis.filter(d=>d.status==='פתוח'||d.status==='שובץ חלקית');
  document.getElementById('rcnt').textContent=open.length;
  const el=document.getElementById('rlist');
  if(!open.length){el.innerHTML='<div style="text-align:center;color:var(--tx3);padding:24px 8px;font-size:12px;">אין דרשיות פתוחות</div>';return;}
  el.innerHTML=open.map(d=>{
    const sc=d.status==='פתוח'?'s-open':'s-partial';
    return`<div class="rcard ${TCLS[d.type]||'T-t'} tlbg tborder" draggable="true" ondragstart="dDrag(event,'${d.id}')">
      <div class="rc-stripe" style="background:var(--tc,#2563eb)"></div>
      <div class="rc-type tcolor">${TL[d.type]||d.type}</div>
      <div class="rc-proj">${d.project}</div>
      <div class="rc-meta">${d.qty>1?d.qty+' מתקינים · ':''}${d.days>1?d.days+' ימים · ':''}${d.date||'ללא תאריך'}${d.addr?'<br>📍 '+d.addr:''}</div>
      <span class="schip ${sc}">${d.status}</span>
      <div class="rbtns" style="margin-top:5px;">
        <button class="rbtn" onclick="openDmod('${d.id}')">✏</button>
        <button class="rbtn" onclick="schedDreshot('${d.id}')">📌 שבץ</button>
        <button class="rbtn del" onclick="delDreshot('${d.id}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

// SCHEDULE
function renderSchedule(dates){
  const area=document.getElementById('main');
  const leg=TYPES.map(t=>`<span class="leg"><span class="ldot" style="background:${TC[t]}"></span>${TL[t]}</span>`).join('');
  let rows='';
  installers.forEach(inst=>{
    const av=inst.name.replace(/\s/g,'').slice(0,2);
    let tds='';
    for(let di=0;di<6;di++){
      const k=ck(inst.name,di);const tod=isToday(dates[di]);const off=isOff(inst.name,dates[di]);
      if(off){
        tds+=`<td class="dcell off-day${tod?' today-c':''}" data-key="${k}" ondragover="cOver(event,'${k}')" ondrop="cDrop(event,'${k}')">
          <div class="off-badge">${offDays[offKey(inst.name,dates[di])]||'חופש'}</div>
          ${isA?`<button onclick="removeOff('${inst.name}','${isoD(dates[di])}')" style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);border:none;background:none;font-size:9px;color:var(--acc);cursor:pointer;">פתח</button>`:''}
        </td>`;
        continue;
      }
      const cs=(chips[k]||[]).map((c,ci)=>{
        const canE=isA||(c.pm===CU)||!c.pm;
        const instsLabel=c.insts&&c.insts.length>1?` +${c.insts.length-1}`:'';
        return`<div class="chip ${TCLS[c.type]||'T-t'} tlbg tborder" ${canE?`draggable="true" ondragstart="cDrag(event,'${k}',${ci})"`:''}>
          <span class="chip-p">${c.project}</span>
          <span class="chip-t tcolor">${TL[c.type]||c.type}${c.days>1?' · '+c.days+'י':''}${instsLabel}</span>
          ${c.date?`<span class="chip-d">📅 ${c.date}</span>`:''}
          ${canE?`<div class="chip-acts">
            <button class="chbtn" onclick="openChipModal('${k}',${ci})">✏</button>
            <button class="chbtn" onclick="cpChip('${k}',${ci})">⎘</button>
            <button class="chbtn" onclick="delChip('${k}',${ci})">✕</button>
          </div>`:''}
        </div>`;
      }).join('');
      tds+=`<td class="dcell${tod?' today-c':''}" data-key="${k}" ondragover="cOver(event,'${k}')" ondrop="cDrop(event,'${k}')">
        <div class="cinn">${cs}
          ${isA?`<button class="addcell" onclick="openCellModal('${k}')">+ שבץ</button>
          <button class="addcell" style="font-size:10px;color:var(--red);" onclick="openOffModal('${inst.name}','${fmt(dates[di])}','${isoD(dates[di])}')">🔴 חופש</button>`
          :`<button class="addcell dreshot-btn" onclick="openDmod(null)">+ דרשייה</button>`}
        </div>
      </td>`;
    }
    rows+=`<tr><td class="icell"><div class="irow"><div class="iav">${av}</div><div><div class="iname">${inst.name}</div>${inst.city?`<div class="icity">${inst.city}</div>`:''}</div></div></td>${tds}</tr>`;
  });
  area.innerHTML=`<div class="legbar">${leg}</div>
    <div class="mwrap"><table>
      <thead><tr><th class="icol">מתקין</th>
      ${DAYS.map((d,i)=>`<th class="dcol${isToday(dates[i])?' today-h':''}"><span class="dh-n">${d}</span><span class="dh-s">${fmt(dates[i])}</span></th>`).join('')}
      </tr></thead><tbody>${rows}</tbody></table></div>`;
}

// INSTALLER VIEW (weekly schedule + detail panel)
function renderInstView(dates){
  const area=document.getElementById('main');
  if(!isA){area.innerHTML='<div style="color:var(--tx3);padding:40px;text-align:center;">גישה מוגבלת לאדמין</div>';return;}

  // Installer management list
  const all=allC();
  const instD={};installers.forEach(i=>instD[i.name]=0);
  all.forEach(c=>{if(instD[c.inst]!==undefined)instD[c.inst]+=c.days;});

  area.innerHTML=`<div style="overflow-y:auto;height:100%;padding-bottom:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-size:13px;font-weight:700;color:var(--tx);">רשימת מתקינים (${installers.length})</div>
      <button class="tbtn g" onclick="openInstEdit(null)">+ מתקין חדש</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:16px;">
      ${installers.map(inst=>{
        const wkD=all.filter(c=>c.inst===inst.name&&c.wk===wk).reduce((s,c)=>s+c.days,0);
        const totD=instD[inst.name]||0;
        const offThisWk=dates.filter(d=>isOff(inst.name,d)).length;
        const av=inst.name.replace(/\s/g,'').slice(0,2);
        return`<div class="inst-card">
          <div class="inst-card-left">
            <div class="inst-card-av">${av}</div>
            <div class="inst-card-info">
              <div class="iname">${inst.name}</div>
              <div class="imeta">📞 ${inst.phone||'—'} · ${inst.city||'—'}</div>
              <div class="imeta" style="margin-top:2px;">מיומנות: <b>${inst.skill||'—'}</b></div>
              ${inst.notes?`<div class="imeta" style="color:var(--tx3);">${inst.notes.slice(0,40)}</div>`:''}
            </div>
          </div>
          <div class="inst-card-right">
            <button class="tbtn" onclick="openInstEdit('${inst.id}')">✏ עריכה</button>
          </div>
          <div class="inst-stats" style="grid-column:1/-1;">
            <div class="inst-stat"><div class="inst-stat-v" style="color:var(--acc);">${wkD}</div><div class="inst-stat-l">ימים השבוע</div></div>
            <div class="inst-stat"><div class="inst-stat-v">${totD}</div><div class="inst-stat-l">ימים סה"כ</div></div>
            <div class="inst-stat"><div class="inst-stat-v" style="color:${offThisWk?'var(--red)':'var(--grn)'};">${offThisWk}</div><div class="inst-stat-l">ימי חופש השבוע</div></div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:10px;">לוח שבועי – כל המתקינים</div>
    <div style="background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);overflow:auto;box-shadow:var(--sh);">
      <table style="border-collapse:collapse;width:100%;table-layout:fixed;">
        <thead><tr>
          <th style="font-size:10px;font-weight:700;color:var(--tx2);text-align:right;padding:8px;background:var(--s2);border:1px solid var(--b);width:90px;">מתקין</th>
          ${DAYS.map((d,i)=>`<th style="font-size:10px;font-weight:700;color:${isToday(dates[i])?'var(--acc)':'var(--tx2)'};text-align:center;padding:7px 3px;background:${isToday(dates[i])?'var(--al)':'var(--s2)'};border:1px solid var(--b);">${d}<br><span style="font-weight:400;font-size:9px;">${fmt(dates[i])}</span></th>`).join('')}
        </tr></thead>
        <tbody>
          ${installers.map(inst=>{
            const av=inst.name.replace(/\s/g,'').slice(0,2);
            return`<tr>
              <td style="border:1px solid var(--b);padding:6px 8px;background:var(--s2);vertical-align:middle;">
                <div class="irow"><div class="iav">${av}</div><div class="iname" style="font-size:11px;">${inst.name}</div></div>
              </td>
              ${dates.map((date,di)=>{
                const k=ck(inst.name,di);const cs=chips[k]||[];const off=isOff(inst.name,date);
                if(off)return`<td style="border:1px solid var(--b);padding:3px;background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 4px,#eef2f7 4px,#eef2f7 8px);text-align:center;"><span style="font-size:9px;font-weight:700;color:var(--tx3);">${offDays[offKey(inst.name,date)]||'חופש'}</span></td>`;
                return`<td style="border:1px solid var(--b);padding:3px;vertical-align:top;min-height:55px;background:${isToday(date)?'#f0f7ff':'#fff'};">
                  ${cs.map(c=>`<div style="background:${TC[c.type]}18;border:1px solid ${TC[c.type]}40;color:${TC[c.type]};border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.project.length>14?c.project.slice(0,13)+'…':c.project}</div>`).join('')}
                </td>`;
              }).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// DRESHOT VIEW
function renderDreshot(){
  const area=document.getElementById('main');
  const vis=isA?dreshyot:dreshyot.filter(d=>d.pm===CU||!d.pm);
  if(!vis.length){area.innerHTML=`<div style="color:var(--tx3);padding:40px;text-align:center;font-size:14px;">אין דרשיות <button class="dbtn pri" style="margin-right:10px;" onclick="openDmod(null)">+ הוסף</button></div>`;return;}
  const byS={open:vis.filter(d=>d.status==='פתוח'),partial:vis.filter(d=>d.status==='שובץ חלקית'),done:vis.filter(d=>d.status==='שובץ')};
  area.innerHTML=`<div class="dview">
    ${byS.open.length?`<div class="dg-title" style="color:var(--acc)">פתוחות <span style="background:var(--al);color:var(--acc);border-radius:20px;padding:1px 8px;font-size:10px;">${byS.open.length}</span></div><div class="dcards">${byS.open.map(dCard).join('')}</div>`:''}
    ${byS.partial.length?`<div class="dg-title" style="color:var(--amb)">שובצו חלקית <span style="background:var(--aml);color:var(--amb);border-radius:20px;padding:1px 8px;font-size:10px;">${byS.partial.length}</span></div><div class="dcards">${byS.partial.map(dCard).join('')}</div>`:''}
    ${byS.done.length?`<div class="dg-title" style="color:var(--grn)">הושלמו ✓ <span style="background:var(--gl);color:var(--grn);border-radius:20px;padding:1px 8px;font-size:10px;">${byS.done.length}</span></div><div class="dcards" style="opacity:.65;">${byS.done.map(dCard).join('')}</div>`:''}
  </div>`;
}
function dCard(d){
  const fLink=d.fileId&&fileStore[d.fileId]?`<div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--acc);cursor:pointer;margin-bottom:7px;font-weight:600;" onclick="openFile('${d.fileId}')">📎 ${fileStore[d.fileId].name}</div>`:'';
  return`<div class="dcard ${TCLS[d.type]||'T-t'}">
    <div class="dc-type tcolor">${TL[d.type]||d.type}</div>
    <div class="dc-proj">${d.project}</div>
    <div class="dc-meta">${d.date?'📅 '+d.date+' · ':''}${d.qty>1?d.qty+' מתקינים · ':''}${d.days>1?d.days+' ימים':'יום'}${d.addr?`<br>📍 ${d.addr}`:''}${(d.contact||d.cphone)?`<br>👤 ${d.contact||''} ${d.cphone||''}`:''}${d.notes?`<br>📝 ${d.notes.slice(0,55)}${d.notes.length>55?'...':''}`:''}</div>
    ${fLink}
    <span class="schip ${d.status==='פתוח'?'s-open':d.status==='שובץ חלקית'?'s-partial':'s-done'}">${d.status}</span>
    <div class="dc-btns" style="margin-top:8px;">
      <button class="dbtn" onclick="openDmod('${d.id}')">✏ עריכה</button>
      <button class="dbtn pri" onclick="schedDreshot('${d.id}')">📌 שבץ</button>
      <button class="dbtn del" onclick="delDreshot('${d.id}')">✕</button>
    </div>
  </div>`;
}

// STATS
function renderStats(dates){
  const area=document.getElementById('main');
  const all=allC();
  const thisW=all.filter(c=>c.wk===wk);
  const totalD=all.reduce((s,c)=>s+c.days,0);
  const thisWD=thisW.reduce((s,c)=>s+c.days,0);
  const instD={};installers.forEach(i=>instD[i.name]=0);all.forEach(c=>{if(instD[c.inst]!==undefined)instD[c.inst]+=c.days;});
  const typeD={};TYPES.forEach(t=>typeD[t]=0);all.forEach(c=>{if(typeD[c.type]!==undefined)typeD[c.type]+=c.days;});
  const projD={};all.forEach(c=>{projD[c.project]=(projD[c.project]||0)+c.days;});
  const topP=Object.entries(projD).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const maxI=Math.max(1,...Object.values(instD));
  const openD=dreshyot.filter(d=>d.status==='פתוח').length;
  const doneD=dreshyot.filter(d=>d.status==='שובץ').length;
  const wks=[...new Set(all.map(c=>c.wk))].sort((a,b)=>a-b).slice(-6);
  const wkDays=wks.map(w=>all.filter(c=>c.wk===w).reduce((s,c)=>s+c.days,0));
  const wkLbls=wks.map(w=>{const d=wd(w);return fmt(d[0]);});

  area.innerHTML=`<div class="stats-area">
  <div class="kpis">
    <div class="kpi" style="--kc:var(--acc)"><div class="kpi-l">ימי התקנה סה"כ</div><div class="kpi-v">${totalD}</div><div class="kpi-s">כל הזמן</div></div>
    <div class="kpi" style="--kc:var(--pur)"><div class="kpi-l">ימי עבודה השבוע</div><div class="kpi-v">${thisWD}</div><div class="kpi-s">${fmt(dates[0])} – ${fmt(dates[5])}</div></div>
    <div class="kpi" style="--kc:var(--amb)"><div class="kpi-l">דרשיות פתוחות</div><div class="kpi-v" style="color:var(--amb)">${openD}</div></div>
    <div class="kpi" style="--kc:var(--grn)"><div class="kpi-l">שיבוצים הושלמו</div><div class="kpi-v" style="color:var(--grn)">${doneD}</div></div>
  </div>
  <div class="cg2">
    <div class="cc"><div class="cc-t">עומס מתקינים</div>
      ${installers.map(i=>`<div class="br"><div class="bn" title="${i.name}">${i.name}</div><div class="bt"><div class="bf" style="width:${Math.round((instD[i.name]||0)/maxI*100)}%;background:var(--acc);"></div></div><div class="bv">${instD[i.name]||0}</div></div>`).join('')}
    </div>
    <div class="cc"><div class="cc-t">פיזור לפי סוג פעולה</div>
      <div style="position:relative;height:150px;"><canvas id="dc" role="img" aria-label="גרף סוגים"></canvas></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">
        ${TYPES.map(t=>`<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2);"><span style="width:9px;height:9px;border-radius:2px;background:${TC[t]};display:inline-block;"></span>${TL[t]} (${typeD[t]||0})</span>`).join('')}
      </div>
    </div>
  </div>
  <div class="cg2" style="margin-top:10px;">
    <div class="cc"><div class="cc-t">טופ פרויקטים</div>
      <div style="position:relative;height:190px;"><canvas id="pc" role="img" aria-label="פרויקטים"></canvas></div>
    </div>
    <div class="cc"><div class="cc-t">מגמה שבועית</div>
      <div style="position:relative;height:190px;"><canvas id="tc" role="img" aria-label="מגמה"></canvas></div>
    </div>
  </div>
  </div>`;

  requestAnimationFrame(()=>{
    const c1=document.getElementById('dc')?.getContext('2d');
    if(c1)new Chart(c1,{type:'doughnut',data:{labels:TYPES.map(t=>TL[t]),datasets:[{data:TYPES.map(t=>typeD[t]||0),backgroundColor:TYPES.map(t=>TC[t]),borderWidth:2,borderColor:'#fff',hoverOffset:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'65%'}});
    const c2=document.getElementById('pc')?.getContext('2d');
    if(c2&&topP.length)new Chart(c2,{type:'bar',data:{labels:topP.map(([p])=>p.length>15?p.slice(0,14)+'…':p),datasets:[{data:topP.map(([,d])=>d),backgroundColor:['#2563eb','#7c3aed','#16a34a','#d97706','#dc2626','#0d9488','#64748b'],borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'#e2e8f0'},ticks:{font:{size:10},color:'#94a3b8'}},y:{grid:{display:false},ticks:{font:{size:10},color:'#475569'}}}}});
    const c3=document.getElementById('tc')?.getContext('2d');
    if(c3&&wkLbls.length)new Chart(c3,{type:'line',data:{labels:wkLbls,datasets:[{label:'ימי עבודה',data:wkDays,borderColor:'#7c3aed',backgroundColor:'#7c3aed12',borderWidth:2.5,fill:true,tension:.4,pointRadius:5,pointBackgroundColor:'#7c3aed',pointBorderColor:'#fff',pointBorderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#e2e8f0'},ticks:{font:{size:10},color:'#94a3b8'}},y:{grid:{color:'#e2e8f0'},ticks:{font:{size:10},color:'#94a3b8'}}}}});
  });
}

// BOOT
document.getElementById('app').style.display='none';
</script>
</body>
