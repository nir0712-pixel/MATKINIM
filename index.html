<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyDesk שיבוץ</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f0f4f8;--s:#fff;--s2:#f8fafc;--s3:#eef2f7;
  --b:#e2e8f0;--b2:#cbd5e1;
  --acc:#2563eb;--acc2:#7c3aed;--al:#eff6ff;
  --grn:#16a34a;--gl:#dcfce7;--amb:#d97706;--aml:#fef3c7;
  --red:#dc2626;--rl:#fee2e2;--pur:#7c3aed;--pl:#ede9fe;
  --teal:#0d9488;--tl2:#ccfbf1;
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --r:10px;--rsm:6px;--rlg:16px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shm:0 4px 14px rgba(0,0,0,.1);--shl:0 20px 40px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--tx);direction:rtl;height:100vh;overflow:hidden;font-size:13px;}

/* LOGIN */
#ls{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb 50%,#7c3aed);display:flex;align-items:center;justify-content:center;z-index:9999;}
.lw{display:flex;flex-direction:column;align-items:center;gap:0;}
.lhero{text-align:center;margin-bottom:28px;}
.lhero h1{font-size:36px;font-weight:900;color:#fff;letter-spacing:-1px;}
.lhero h1 span{color:#93c5fd;}
.lhero p{color:#93c5fd;font-size:14px;margin-top:4px;}
.lcard{background:#fff;border-radius:20px;padding:36px 40px;width:360px;box-shadow:var(--shl);}
.lcard h2{font-size:17px;font-weight:700;margin-bottom:3px;}
.lcard p{color:var(--tx3);font-size:12px;margin-bottom:22px;}
.lf label{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px;}
.lf{margin-bottom:13px;}
.lf select,.lf input{width:100%;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:9px 12px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;background:#fff;}
.lf select:focus,.lf input:focus{outline:none;border-color:var(--acc);}
.lerr{color:var(--red);font-size:11px;margin-top:4px;display:none;}
.lbtn{width:100%;background:var(--acc);border:none;border-radius:var(--rsm);padding:11px;color:#fff;font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
.lbtn:hover{background:#1d4ed8;}

/* APP */
.app{display:grid;grid-template-rows:52px 1fr;height:100vh;}
.top{background:var(--s);border-bottom:1.5px solid var(--b);padding:0 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);}
.logo{font-size:15px;font-weight:900;color:var(--tx);flex:none;}
.logo span{color:var(--acc);}
.sep{width:1px;height:20px;background:var(--b2);flex:none;}
.tabs{display:flex;gap:1px;background:var(--s2);padding:3px;border-radius:8px;}
.tab{padding:4px 11px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--tx2);font-family:'Heebo',sans-serif;}
.tab.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:var(--sh);}
.wnav{display:flex;align-items:center;gap:5px;margin-right:auto;}
.wb{background:var(--s2);border:1.5px solid var(--b);color:var(--tx2);border-radius:var(--rsm);padding:4px 9px;cursor:pointer;font-size:12px;font-weight:600;}
.wb:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}
.wl{font-size:13px;font-weight:600;min-width:125px;text-align:center;}
.tbtn{background:var(--s2);border:1.5px solid var(--b);color:var(--tx2);border-radius:var(--rsm);padding:4px 10px;cursor:pointer;font-size:11px;font-family:'Heebo',sans-serif;font-weight:500;white-space:nowrap;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}
.tbtn.g{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}
.tbtn.g:hover{background:#1d4ed8;}
.tbtn.gr{background:var(--grn);border-color:var(--grn);color:#fff;font-weight:700;}
.tbtn.gr:hover{background:#15803d;}
.upill{display:flex;align-items:center;gap:5px;background:var(--s2);border:1.5px solid var(--b);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;}
.udot{width:7px;height:7px;border-radius:50%;background:var(--grn);}
.badge{border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;}
.ba{background:var(--pl);color:var(--pur);border:1px solid #c4b5fd;}
.bp{background:var(--al);color:var(--acc);border:1px solid #bfdbfe;}

/* BODY */
.body{display:grid;grid-template-columns:272px 1fr;overflow:hidden;}
.sb{background:var(--s);border-left:1.5px solid var(--b);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh);}
.sbh{padding:9px 12px;font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:.07em;text-transform:uppercase;border-bottom:1.5px solid var(--b);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--s2);}
.sbh button{background:var(--acc);border:none;border-radius:5px;padding:3px 9px;font-size:11px;color:#fff;cursor:pointer;font-family:'Heebo',sans-serif;font-weight:700;}
.rscroll{overflow-y:auto;flex:1;padding:7px;}
.rscroll::-webkit-scrollbar{width:4px;}
.rscroll::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}

/* REQUEST CARDS */
.rcard{border-radius:var(--r);padding:9px 11px;margin-bottom:7px;cursor:grab;border:1.5px solid;user-select:none;transition:box-shadow .12s,transform .1s;background:#fff;}
.rcard:hover{box-shadow:var(--shm);transform:translateY(-1px);}
.rcard.dragging{opacity:.4;}
.rc-stripe{height:3px;border-radius:2px;margin-bottom:7px;}
.rc-type{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;}
.rc-proj{font-weight:700;font-size:12px;line-height:1.3;margin-bottom:3px;}
.rc-meta{font-size:10px;color:var(--tx2);line-height:1.7;}
.rbtns{display:flex;gap:3px;margin-top:6px;}
.rbtn{background:var(--s2);border:1px solid var(--b);border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;color:var(--tx2);font-family:'Heebo',sans-serif;font-weight:500;}
.rbtn:hover{background:var(--al);color:var(--acc);border-color:var(--acc);}
.rbtn.del{color:var(--red);}
.rbtn.del:hover{background:var(--rl);border-color:var(--red);}
.schip{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid;}
.s-open{background:#eff6ff;color:#2563eb;border-color:#bfdbfe;}
.s-partial{background:#fef3c7;color:#d97706;border-color:#fcd34d;}
.s-done{background:#dcfce7;color:#16a34a;border-color:#86efac;}
.s-cancel{background:#fee2e2;color:#dc2626;border-color:#fca5a5;}

/* TYPE SYSTEM */
.T-t{--tc:#2563eb;--tl:#eff6ff;--tb:#bfdbfe;}
.T-m{--tc:#64748b;--tl:#f8fafc;--tb:#cbd5e1;}
.T-z{--tc:#d97706;--tl:#fef3c7;--tb:#fcd34d;}
.T-w{--tc:#16a34a;--tl:#dcfce7;--tb:#86efac;}
.T-r{--tc:#dc2626;--tl:#fee2e2;--tb:#fca5a5;}
.T-p{--tc:#7c3aed;--tl:#ede9fe;--tb:#c4b5fd;}

/* MATRIX */
.main{overflow:hidden;display:flex;flex-direction:column;padding:10px 12px;gap:8px;}
.legbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);font-weight:500;}
.ldot{width:10px;height:10px;border-radius:3px;}
.mwrap{flex:1;background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);overflow:auto;box-shadow:var(--sh);}
.mwrap::-webkit-scrollbar{width:5px;height:5px;}
.mwrap::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px;}
table{border-collapse:collapse;width:100%;table-layout:fixed;}
th{font-size:10px;font-weight:700;color:var(--tx2);text-align:center;padding:8px 3px;background:var(--s2);border:1.5px solid var(--b);position:sticky;top:0;z-index:5;white-space:nowrap;}
th.icol{text-align:right;padding-right:8px;width:96px;background:var(--s3);}
th.dcol{width:calc((100% - 96px)/6);}
.dh-n{font-size:13px;font-weight:800;color:var(--tx);display:block;}
.dh-s{font-size:10px;color:var(--tx3);display:block;font-weight:500;}
th.today-h .dh-n{color:var(--acc);}
th.today-h{background:var(--al)!important;}
td.icell{border:1.5px solid var(--b);padding:6px 8px;background:var(--s2);vertical-align:middle;}
.irow{display:flex;align-items:center;gap:6px;}
.iav{width:26px;height:26px;border-radius:50%;background:var(--al);color:var(--acc);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid #bfdbfe;}
.iname{font-size:12px;font-weight:700;}
.icity{font-size:9px;color:var(--tx3);}
td.dcell{border:1.5px solid var(--b);padding:3px;vertical-align:top;min-height:66px;transition:background .08s;}
td.dcell.today-c{background:#f0f7ff;}
td.dcell.dov{background:var(--al);border-color:var(--acc);}
.cinn{min-height:60px;display:flex;flex-direction:column;gap:2px;}
.chip{border-radius:6px;padding:4px 6px;border:1.5px solid;cursor:pointer;}
.chip-p{font-size:11px;font-weight:700;display:block;line-height:1.3;color:var(--tc);}
.chip-t{font-size:9px;display:block;color:var(--tc);opacity:.8;font-weight:600;}
.chip-d{font-size:9px;display:block;color:var(--tx3);}
.chip-acts{display:none;gap:2px;margin-top:3px;}
.chip:hover .chip-acts{display:flex;}
.chbtn{background:rgba(0,0,0,.06);border:none;border-radius:3px;padding:2px 5px;font-size:9px;cursor:pointer;color:var(--tc);font-family:'Heebo',sans-serif;font-weight:600;}
.chbtn:hover{background:rgba(0,0,0,.12);}
.addcell{border:1.5px dashed var(--b2);background:transparent;border-radius:6px;padding:3px;width:100%;cursor:pointer;color:var(--tx3);font-size:13px;text-align:center;transition:all .12s;font-family:'Heebo',sans-serif;margin-top:1px;}
.addcell:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}

/* DRESHOT VIEW */
.dview{overflow-y:auto;height:100%;padding-bottom:20px;}
.dview::-webkit-scrollbar{width:5px;}
.dview::-webkit-scrollbar-thumb{background:var(--b2);}
.dg-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px;display:flex;align-items:center;gap:8px;}
.dg-title::after{content:'';flex:1;height:1px;background:var(--b);}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:8px;margin-bottom:6px;}
.dcard{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);transition:box-shadow .15s,transform .1s;position:relative;overflow:hidden;}
.dcard::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--tc);}
.dcard:hover{box-shadow:var(--shm);transform:translateY(-2px);}
.dc-type{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);margin-bottom:5px;}
.dc-proj{font-size:13px;font-weight:700;margin-bottom:6px;line-height:1.3;}
.dc-meta{font-size:11px;color:var(--tx2);line-height:1.7;margin-bottom:8px;}
.dc-file{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--acc);margin-bottom:8px;cursor:pointer;}
.dc-btns{display:flex;gap:5px;flex-wrap:wrap;}
.dbtn{background:var(--s2);border:1.5px solid var(--b);border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--tx2);font-family:'Heebo',sans-serif;font-weight:600;transition:all .12s;}
.dbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}
.dbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff;}
.dbtn.pri:hover{background:#1d4ed8;}
.dbtn.del{color:var(--red);}
.dbtn.del:hover{background:var(--rl);border-color:var(--red);}

/* PROJECT STATS */
.pstats{overflow-y:auto;height:100%;padding-bottom:20px;}
.pstats::-webkit-scrollbar{width:5px;}
.pstats::-webkit-scrollbar-thumb{background:var(--b2);}
.ps-search{margin-bottom:12px;}
.ps-search input{width:100%;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:8px 12px;font-family:'Heebo',sans-serif;font-size:13px;color:var(--tx);}
.ps-search input:focus{outline:none;border-color:var(--acc);}
.prow{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);transition:box-shadow .15s;}
.prow:hover{box-shadow:var(--shm);}
.prow-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.prow-name{font-size:13px;font-weight:700;}
.prow-pm{font-size:10px;color:var(--tx3);background:var(--s2);border:1px solid var(--b);border-radius:20px;padding:2px 8px;}
.prow-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pbar{text-align:center;}
.pbar-lbl{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.pbar-val{font-size:22px;font-weight:900;line-height:1;}
.pbar-sub{font-size:9px;color:var(--tx3);margin-top:2px;}
.pbar-track{height:5px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:4px;}
.pbar-fill{height:100%;border-radius:3px;}

/* STATS VIEW */
.stats-area{overflow-y:auto;height:100%;padding-bottom:20px;}
.stats-area::-webkit-scrollbar{width:5px;}
.stats-area::-webkit-scrollbar-thumb{background:var(--b2);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.kpi{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;bottom:0;right:0;left:0;height:3px;background:var(--kc,var(--acc));}
.kpi-l{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.kpi-v{font-size:28px;font-weight:900;line-height:1;}
.kpi-s{font-size:10px;color:var(--tx3);margin-top:3px;}
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.cc{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:14px;box-shadow:var(--sh);}
.cc-t{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.br{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.bn{font-size:11px;color:var(--tx2);width:88px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.bt{flex:1;height:9px;background:var(--s2);border-radius:5px;overflow:hidden;}
.bf{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bv{font-size:11px;color:var(--tx3);width:22px;text-align:left;font-weight:600;}

/* SEND MODAL - CALENDAR LAYOUT */
.cal-send{overflow-x:auto;}
.cal-table{border-collapse:collapse;width:100%;min-width:620px;}
.cal-table th{font-size:10px;font-weight:800;color:var(--tx2);text-align:center;padding:7px 4px;background:var(--s2);border:1px solid var(--b);letter-spacing:.04em;}
.cal-table th.inst-th{text-align:right;padding-right:8px;width:90px;}
.cal-table td{border:1px solid var(--b);padding:3px;vertical-align:top;}
.cal-table td.inst-td{background:var(--s2);padding:5px 8px;white-space:nowrap;}
.cal-table td.day-td{background:#fff;min-width:80px;height:50px;}
.cal-chip-s{display:block;border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-inst-n{font-size:11px;font-weight:700;color:var(--tx);}
.cal-inst-c{font-size:9px;color:var(--tx3);}
.cal-today{background:#eff6ff!important;}

/* PRINT SEND */
@media print{
  body{overflow:visible!important;height:auto!important;}
  .app{display:block!important;height:auto!important;}
  .top,.body>.sb{display:none!important;}
  #print-area{display:block!important;}
  .main{overflow:visible!important;height:auto!important;}
  .send-modal{max-height:none!important;}
}
#print-area{display:none;}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.ov.open{display:flex;}
.modal{background:var(--s);border:1.5px solid var(--b);border-radius:var(--rlg);padding:22px 24px;width:440px;max-height:90vh;overflow-y:auto;box-shadow:var(--shl);}
.modal::-webkit-scrollbar{width:4px;}
.modal::-webkit-scrollbar-thumb{background:var(--b2);}
.modal h3{font-size:15px;font-weight:800;margin-bottom:16px;}
.mf{margin-bottom:11px;}
.mf label{font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px;}
.mf select,.mf input,.mf textarea{width:100%;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:8px 11px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;background:#fff;}
.mf select:focus,.mf input:focus,.mf textarea:focus{outline:none;border-color:var(--acc);}
.mf textarea{resize:vertical;min-height:60px;}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.msep{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:10px 0 6px;border-top:1px solid var(--b);margin-top:4px;}
.file-upload-area{border:2px dashed var(--b2);border-radius:var(--rsm);padding:14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.file-upload-area:hover{border-color:var(--acc);background:var(--al);}
.file-upload-area input{display:none;}
.file-upload-txt{font-size:12px;color:var(--tx3);}
.file-preview{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--b);border-radius:var(--rsm);padding:8px 10px;margin-top:6px;}
.file-preview span{font-size:11px;color:var(--tx2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-preview button{background:none;border:none;cursor:pointer;color:var(--red);font-size:14px;}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1.5px solid var(--b);}
.mbtn{border-radius:var(--rsm);padding:8px 18px;cursor:pointer;font-size:13px;font-family:'Heebo',sans-serif;font-weight:700;border:1.5px solid;}
.mbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff;}
.mbtn.pri:hover{background:#1d4ed8;}
.mbtn.can{background:transparent;border-color:var(--b2);color:var(--tx3);}
.mbtn.can:hover{color:var(--tx);}

/* SEND MODAL */
.smodal{width:780px;max-width:96vw;}
.ichklist{max-height:130px;overflow-y:auto;background:var(--s2);border:1.5px solid var(--b);border-radius:var(--rsm);margin-bottom:12px;}
.ich{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--b);cursor:pointer;}
.ich:last-child{border-bottom:none;}
.ich:hover{background:var(--al);}
.ich input{accent-color:var(--acc);cursor:pointer;}
.sbtns{display:flex;gap:8px;margin-top:12px;}
.sbtn{flex:1;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:9px;cursor:pointer;font-size:12px;font-family:'Heebo',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
.sbtn.wa{background:#25D366;border-color:#25D366;color:#fff;}
.sbtn.wa:hover{background:#22c55e;}
.sbtn.cp{background:var(--s2);color:var(--tx2);}
.sbtn.cp:hover{border-color:var(--acc);color:var(--acc);background:var(--al);}
.sbtn.pr{background:var(--pur);border-color:var(--pur);color:#fff;}
.sbtn.pr:hover{background:#6d28d9;}

/* LOADER */

// ═══ FILE HANDLING ════════════════════════════════════
function handleFile(input,previewId){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const id='f'+nid++;
    fileStore[id]={name:f.name,dataUrl:e.target.result};
    input.dataset.fileId=id;
    document.getElementById(previewId).style.display='flex';
    const nm=previewId==='ffile-preview'?'ffile-name':'dffile-name';
    document.getElementById(nm).textContent=f.name;
  };
  r.readAsDataURL(f);
}
function clearFile(inputId,previewId){
  document.getElementById(inputId).value='';
  document.getElementById(inputId).dataset.fileId='';
  document.getElementById(previewId).style.display='none';
}
function getFileId(inputId){return document.getElementById(inputId).dataset.fileId||null;}

function dDrag(e,id){dragSrc={t:'d',id};e.dataTransfer.effectAllowed='move';}
function cDrag(e,k,ci){dragSrc={t:'c',k,ci};e.dataTransfer.effectAllowed='move';}
function cOver(e,key){e.preventDefault();document.querySelectorAll('.dcell').forEach(c=>c.classList.remove('dov'));document.querySelector(`[data-key="${key}"]`)?.classList.add('dov');}
function cDrop(e,key){
  e.preventDefault();document.querySelectorAll('.dcell').forEach(c=>c.classList.remove('dov'));
  if(!dragSrc)return;
  const dates=wd(wk);const di=+key.split('__')[1];const dayDate=isoDate(dates[di]);
  if(dragSrc.t==='d'){
    const d=dreshyot.find(x=>x.id===dragSrc.id);
    if(d){if(!chips[key])chips[key]=[];chips[key].push({id:'c'+nid++,project:d.project,type:d.type,installer:key.split('__')[0],pm:d.pm||CU,days:d.days,date:dayDate,addr:d.addr,contact:d.contact,cphone:d.cphone,notes:d.notes,fileId:d.fileId});d.status='שובץ חלקית';}
  }else if(dragSrc.t==='c'){
    if(dragSrc.k===key){dragSrc=null;return;}
    const c=chips[dragSrc.k]?.[dragSrc.ci];
    if(c){chips[dragSrc.k].splice(dragSrc.ci,1);if(!chips[key])chips[key]=[];chips[key].push({...c,date:dayDate});}
  }
  dragSrc=null;save();render();
}
function dq(e){
  e.preventDefault();
  if(!dragSrc||dragSrc.t!=='c')return;
  const c=chips[dragSrc.k]?.[dragSrc.ci];
  if(c){chips[dragSrc.k].splice(dragSrc.ci,1);dreshyot.unshift({id:'d'+nid++,project:c.project,type:c.type,qty:1,days:c.days,date:c.date,addr:c.addr,contact:c.contact,cphone:c.cphone,notes:c.notes,fileId:c.fileId,status:'פתוח',pm:c.pm});}
  dragSrc=null;save();render();
}

function buildSend(single){
  const dates=wd(wk);
  const sel=document.getElementById('ssel');
  const tgts=single&&sel?[sel.value]:installers.map(i=>i.name).filter(n=>{const cb=document.getElementById('sc-'+n);return cb&&cb.checked;});

  // ── CALENDAR ──
  const cal=document.getElementById('cal-preview');
  let ch=`<table class="cal-table"><thead><tr>
    <th class="inst-th">מתקין</th>
    ${DAYS.map((d,i)=>`<th style="${isToday(dates[i])?'color:var(--acc);background:var(--al);':''}">${d}<br><span style="font-weight:400;font-size:9px;">${fmt(dates[i])}</span></th>`).join('')}
  </tr></thead><tbody>`;
  tgts.forEach(nm=>{
    const av=nm.replace(/\s/g,'').slice(0,2);
    ch+=`<tr><td class="inst-td"><div style="display:flex;align-items:center;gap:5px;"><div class="cal-av">${av}</div><div><div class="cal-inst-n">${nm}</div><div class="cal-inst-c">${installers.find(i=>i.name===nm)?.phone||''}</div></div></div></td>`;
    for(let di=0;di<6;di++){
      const k=ck(nm,di);const cs=chips[k]||[];
      ch+=`<td class="day-td${isToday(dates[di])?' cal-today':''}">`;
      if(cs.length){cs.forEach(c=>{ch+=`<span class="cal-chip-s ${TCLASS[c.type]||''}" style="background:${TC[c.type]}18;border:1px solid ${TC[c.type]}40;color:${TC[c.type]};">${c.project.length>14?c.project.slice(0,13)+'…':c.project}</span>`;});}
      else{ch+=`<span style="color:var(--tx3);font-size:9px;padding:2px 4px;">—</span>`;}
      ch+='</td>';
    }
    ch+='</tr>';
  });
  ch+='</tbody></table>';
  cal.innerHTML=ch;

  // ── WHATSAPP TEXT ──
  let txt=`*סידור עבודה – שבוע ${fmt(dates[0])} – ${fmt(dates[5])}*\n${'━'.repeat(28)}\n`;
  let any=false;
  tgts.forEach(nm=>{
    const rows=[];
    DAYS.forEach((day,di)=>{
      const cs=chips[ck(nm,di)]||[];if(!cs.length)return;
      rows.push(`\n  *${day} ${fmt(dates[di])}*`);
      cs.forEach(c=>{
        rows.push(`  • ${c.project} – ${TL[c.type]||c.type}${c.days>1?', '+c.days+' ימים':''}`);
        if(c.date)rows.push(`    📅 תאריך: ${c.date}`);
        if(c.addr)rows.push(`    📍 כתובת: ${c.addr}`);
        if(c.contact||c.cphone)rows.push(`    👤 ${c.contact||''}${c.cphone?' '+c.cphone:''}`);
        if(c.notes)rows.push(`    📝 ${c.notes}`);
        if(c.fileId&&fileStore[c.fileId])rows.push(`    📎 קובץ תוכנית: ${fileStore[c.fileId].name}`);
      });
    });
    if(rows.length){txt+=`\n🔧 *${nm}*${rows.join('\n')}\n`;any=true;}
  });
  if(!any)txt+='\n(אין שיבוצים בשבוע זה)';
  document.getElementById('prevbox').textContent=txt;
}

  const sorted=Object.entries(projData).sort((a,b)=>b[1].total-a[1].total);

  const full=Object.entries(projMap).sort((a,b)=>b[1].total-a[1].total);

  area.innerHTML=`<div class="pstats">
    <div class="ps-search"><input id="psearch" type="text" placeholder="חיפוש פרויקט..." oninput="filterProjs()" style="background:#fff;color:var(--tx);"></div>
    <div id="plist">${full.map(([name,v])=>{
      const pm=PROJ0.find(p=>p.n===name)?.pm||'';
      const typeKeys=TYPES.filter(t=>v.types[t]);

          <div class="prow-name">${name}</div>
          <div class="prow-pm">מנהל: ${pm}</div>

        <div class="prow-bars">
          <div class="pbar">
            <div class="pbar-lbl">סה"כ ימים</div>
            <div class="pbar-val" style="color:var(--acc);">${v.total}</div>
            <div class="pbar-track"><div class="pbar-fill" style="width:${Math.round(v.total/maxD*100)}%;background:var(--acc);"></div></div>
          </div>
          ${TYPES.slice(0,2).map(t=>`<div class="pbar">
            <div class="pbar-lbl" style="color:${TC[t]}">${TL[t]}</div>
            <div class="pbar-val" style="color:${TC[t]};">${v.types[t]||0}</div>
            <div class="pbar-track"><div class="pbar-fill" style="width:${Math.round((v.types[t]||0)/Math.max(1,v.total)*100)}%;background:${TC[t]};"></div></div>
          </div>`).join('')}
        </div>
        ${typeKeys.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;">
          ${typeKeys.map(t=>`<span style="background:${TC[t]}18;color:${TC[t]};border:1px solid ${TC[t]}40;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;">${TL[t]}: ${v.types[t]}י</span>`).join('')}
        </div>`:'<div style="font-size:11px;color:var(--tx3);margin-top:4px;">אין שיבוצים עדיין</div>'}
      </div>`;}).join('')}
    </div>
  </div>`;
}
function filterProjs(){
  const q=document.getElementById('psearch').value.toLowerCase();
  document.querySelectorAll('#plist .prow').forEach(row=>{
    row.style.display=row.dataset.name.includes(q)?'':'none';
  });
}

// STATS VIEW
function renderStats(dates){
  const area=document.getElementById('main');
  const all=allC();
  const thisW=all.filter(c=>c.wk===wk);
  const totalD=all.reduce((s,c)=>s+c.days,0);
  const thisWD=thisW.reduce((s,c)=>s+c.days,0);
  const instD={};installers.forEach(i=>instD[i.name]=0);all.forEach(c=>{if(instD[c.inst]!==undefined)instD[c.inst]+=c.days;});
  const typeD={};TYPES.forEach(t=>typeD[t]=0);all.forEach(c=>{if(typeD[c.type]!==undefined)typeD[c.type]+=c.days;});
  const projD={};all.forEach(c=>{projD[c.project]=(projD[c.project]||0)+c.days;});
  const topP=Object.entries(projD).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const maxI=Math.max(1,...Object.values(instD));
  const openD=dreshyot.filter(d=>d.status==='פתוח').length;
  const doneD=dreshyot.filter(d=>d.status==='שובץ').length;
  const wks=[...new Set(all.map(c=>c.wk))].sort((a,b)=>a-b).slice(-6);
  const wkDays=wks.map(w=>all.filter(c=>c.wk===w).reduce((s,c)=>s+c.days,0));
  const wkLbls=wks.map(w=>{const d=wd(w);return fmt(d[0]);});

  area.innerHTML=`<div class="stats-area">
  <div class="kpis">
    <div class="kpi" style="--kc:var(--acc)"><div class="kpi-l">ימי התקנה סה"כ</div><div class="kpi-v">${totalD}</div><div class="kpi-s">כל הזמן</div></div>
    <div class="kpi" style="--kc:var(--pur)"><div class="kpi-l">ימי עבודה השבוע</div><div class="kpi-v">${thisWD}</div><div class="kpi-s">${fmt(dates[0])} – ${fmt(dates[5])}</div></div>
    <div class="kpi" style="--kc:var(--amb)"><div class="kpi-l">דרשיות פתוחות</div><div class="kpi-v" style="color:var(--amb)">${openD}</div></div>
    <div class="kpi" style="--kc:var(--grn)"><div class="kpi-l">שיבוצים הושלמו</div><div class="kpi-v" style="color:var(--grn)">${doneD}</div></div>
  </div>
  <div class="cg2">
    <div class="cc"><div class="cc-t">עומס מתקינים – ימי עבודה</div>
      ${installers.map(i=>`<div class="br"><div class="bn" title="${i.name}">${i.name}</div><div class="bt"><div class="bf" style="width:${Math.round((instD[i.name]||0)/maxI*100)}%;background:var(--acc);"></div></div><div class="bv">${instD[i.name]||0}</div></div>`).join('')}
    </div>
    <div class="cc"><div class="cc-t">פיזור לפי סוג פעולה</div>
      <div style="position:relative;height:160px;"><canvas id="donut-c" role="img" aria-label="גרף סוגים"></canvas></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">
        ${TYPES.map(t=>`<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2);"><span style="width:9px;height:9px;border-radius:2px;background:${TC[t]};display:inline-block;"></span>${TL[t]} (${typeD[t]||0})</span>`).join('')}
      </div>
    </div>
  </div>
  <div class="cg2" style="margin-top:10px;">
    <div class="cc"><div class="cc-t">טופ פרויקטים – ימי עבודה</div>
      <div style="position:relative;height:190px;"><canvas id="proj-c" role="img" aria-label="גרף פרויקטים"></canvas></div>
    </div>
    <div class="cc"><div class="cc-t">מגמה שבועית</div>
      <div style="position:relative;height:190px;"><canvas id="trend-c" role="img" aria-label="מגמה שבועית"></canvas></div>
    </div>
  </div>
  </div>`;

  requestAnimationFrame(()=>{
    const ctx1=document.getElementById('donut-c')?.getContext('2d');
    if(ctx1)new Chart(ctx1,{type:'doughnut',data:{labels:TYPES.map(t=>TL[t]),datasets:[{data:TYPES.map(t=>typeD[t]||0),backgroundColor:TYPES.map(t=>TC[t]),borderWidth:2,borderColor:'#fff',hoverOffset:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'65%'}});
    const ctx2=document.getElementById('proj-c')?.getContext('2d');
    if(ctx2)new Chart(ctx2,{type:'bar',data:{labels:topP.map(([p])=>p.length>15?p.slice(0,14)+'…':p),datasets:[{data:topP.map(([,d])=>d),backgroundColor:topP.map((_,i)=>['#2563eb','#7c3aed','#16a34a','#d97706','#dc2626','#0d9488','#64748b'][i]||'#2563eb'),borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'#e2e8f0'},ticks:{font:{size:10},color:'#94a3b8'}},y:{grid:{display:false},ticks:{font:{size:10},color:'#475569'}}}}});
    const ctx3=document.getElementById('trend-c')?.getContext('2d');
    if(ctx3&&wkLbls.length)new Chart(ctx3,{type:'line',data:{labels:wkLbls,datasets:[{label:'ימי עבודה',data:wkDays,borderColor:'#7c3aed',backgroundColor:'#7c3aed12',borderWidth:2.5,fill:true,tension:.4,pointRadius:5,pointBackgroundColor:'#7c3aed',pointBorderColor:'#fff',pointBorderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#e2e8f0'},ticks:{font:{size:10},color:'#94a3b8'}},y:{grid:{color:'#e2e8f0'},ticks:{font:{size:10},color:'#94a3b8'}}}}});
  });
}
