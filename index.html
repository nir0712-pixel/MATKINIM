<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyDesk – מערכת שיבוץ מתקינים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f7f8fc;--s:#ffffff;--s2:#f0f2f8;--s3:#e8ebf5;
  --b:#e2e6f0;--b2:#cdd3e8;
  --acc:#2563eb;--acc2:#7c3aed;--acc-light:#eff6ff;
  --grn:#16a34a;--grn-l:#dcfce7;
  --amb:#d97706;--amb-l:#fef3c7;
  --red:#dc2626;--red-l:#fee2e2;
  --pur:#7c3aed;--pur-l:#ede9fe;
  --teal:#0d9488;--teal-l:#ccfbf1;
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --r:10px;--rsm:6px;--rlg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 20px 40px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--tx);direction:rtl;height:100vh;overflow:hidden;font-size:13px;}

/* ── LOGIN ── */
#ls{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#7c3aed 100%);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-wrap{display:flex;flex-direction:column;align-items:center;gap:0;}
.login-hero{text-align:center;margin-bottom:32px;}
.login-hero h1{font-size:36px;font-weight:900;color:#fff;letter-spacing:-1px;margin-bottom:6px;}
.login-hero h1 span{color:#93c5fd;}
.login-hero p{color:#93c5fd;font-size:14px;}
.lcard{background:#fff;border-radius:20px;padding:36px 40px;width:360px;box-shadow:var(--shadow-lg);}
.lcard h2{font-size:18px;font-weight:700;color:var(--tx);margin-bottom:4px;}
.lcard p{color:var(--tx3);font-size:12px;margin-bottom:24px;}
.lfield{margin-bottom:14px;}
.lfield label{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px;}
.lfield select,.lfield input{width:100%;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:9px 12px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;background:#fff;transition:border-color .15s;}
.lfield select:focus,.lfield input:focus{outline:none;border-color:var(--acc);}
.lerr{color:var(--red);font-size:11px;margin-top:4px;display:none;}
.lbtn{width:100%;background:var(--acc);border:none;border-radius:var(--rsm);padding:11px;color:#fff;font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .15s;}
.lbtn:hover{background:#1d4ed8;}

/* ── APP SHELL ── */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh;}

/* ── TOPBAR ── */
.top{background:var(--s);border-bottom:1.5px solid var(--b);padding:0 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);}
.logo{font-size:16px;font-weight:900;color:var(--tx);letter-spacing:-0.5px;flex:none;}
.logo span{color:var(--acc);}
.divider{width:1px;height:20px;background:var(--b2);flex:none;}
.tabs{display:flex;gap:1px;background:var(--s2);padding:3px;border-radius:8px;}
.tab{padding:5px 13px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--tx2);font-family:'Heebo',sans-serif;transition:all .15s;white-space:nowrap;}
.tab.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:var(--shadow);}
.wnav{display:flex;align-items:center;gap:6px;margin-right:auto;}
.wbtn{background:var(--s2);border:1.5px solid var(--b);color:var(--tx2);border-radius:var(--rsm);padding:4px 10px;cursor:pointer;font-size:12px;transition:all .15s;font-weight:600;}
.wbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-light);}
.wlbl{font-size:13px;font-weight:600;color:var(--tx);min-width:130px;text-align:center;}
.tbtn{background:var(--s2);border:1.5px solid var(--b);color:var(--tx2);border-radius:var(--rsm);padding:5px 12px;cursor:pointer;font-size:12px;font-family:'Heebo',sans-serif;font-weight:500;white-space:nowrap;transition:all .15s;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-light);}
.tbtn.blue{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}
.tbtn.blue:hover{background:#1d4ed8;}
.tbtn.grn{background:var(--grn);border-color:var(--grn);color:#fff;font-weight:700;}
.tbtn.grn:hover{background:#15803d;}
.sync{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx3);}
.sdot{width:7px;height:7px;border-radius:50%;}
.sdot.ok{background:var(--grn);}
.sdot.load{background:var(--amb);animation:blink .8s infinite;}
.sdot.err{background:var(--red);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.upill{display:flex;align-items:center;gap:6px;background:var(--s2);border:1.5px solid var(--b);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--tx);}
.udot{width:7px;height:7px;border-radius:50%;background:var(--grn);}
.rbadge{border-radius:6px;padding:3px 8px;font-size:10px;font-weight:800;letter-spacing:.04em;}
.rba{background:var(--pur-l);color:var(--pur);border:1px solid #c4b5fd;}
.rbp{background:var(--acc-light);color:var(--acc);border:1px solid #bfdbfe;}

/* ── BODY LAYOUT ── */
.body{display:grid;grid-template-columns:280px 1fr;overflow:hidden;}
.sb{background:var(--s);border-left:1.5px solid var(--b);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);}
.sbh{padding:10px 12px;font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:.07em;text-transform:uppercase;border-bottom:1.5px solid var(--b);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--s2);}
.sbh button{background:var(--acc);border:none;border-radius:5px;padding:4px 10px;font-size:11px;color:#fff;cursor:pointer;font-family:'Heebo',sans-serif;font-weight:700;}
.rscroll{overflow-y:auto;flex:1;padding:8px;}
.rscroll::-webkit-scrollbar{width:4px;}
.rscroll::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}

/* ── REQUEST CARDS ── */
.rcard{border-radius:var(--r);padding:9px 11px;margin-bottom:7px;cursor:grab;border:1.5px solid;user-select:none;transition:box-shadow .12s,transform .1s;background:#fff;}
.rcard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.rcard.dragging{opacity:.4;transform:scale(.96);}
.rc-stripe{height:3px;border-radius:2px;margin-bottom:7px;}
.rc-type{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;}
.rc-proj{font-weight:700;font-size:12px;line-height:1.3;margin-bottom:3px;color:var(--tx);}
.rc-meta{font-size:10px;color:var(--tx2);line-height:1.7;}
.rcard .rbtns{display:flex;gap:3px;margin-top:6px;}
.rbtn{background:var(--s2);border:1px solid var(--b);border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;color:var(--tx2);font-family:'Heebo',sans-serif;font-weight:500;}
.rbtn:hover{background:var(--acc-light);color:var(--acc);border-color:var(--acc);}
.rbtn.del{color:var(--red);}
.rbtn.del:hover{background:var(--red-l);border-color:var(--red);}

/* TYPE SYSTEM */
.T-זיגוג{--tc:#d97706;--tl:#fef3c7;--tb:#fcd34d;}
.T-וואן-שוט{--tc:#16a34a;--tl:#dcfce7;--tb:#86efac;}
.T-תיקונים{--tc:#dc2626;--tl:#fee2e2;--tb:#fca5a5;}
.T-תחילת-התקנה{--tc:#2563eb;--tl:#eff6ff;--tb:#93c5fd;}
.T-המשך-התקנה{--tc:#64748b;--tl:#f1f5f9;--tb:#cbd5e1;}
.tcolor{color:var(--tc);}.tlbg{background:var(--tl);}.tborder{border-color:var(--tb);}

/* ── MATRIX ── */
.main{overflow:hidden;display:flex;flex-direction:column;padding:10px 12px;gap:8px;}
.legend-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);font-weight:500;}
.ldot{width:10px;height:10px;border-radius:3px;}
.mwrap{flex:1;background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow);}
.mwrap::-webkit-scrollbar{width:5px;height:5px;}
.mwrap::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px;}
table{border-collapse:collapse;width:100%;table-layout:fixed;}
th{font-size:11px;font-weight:700;color:var(--tx2);text-align:center;padding:9px 4px;background:var(--s2);border:1.5px solid var(--b);position:sticky;top:0;z-index:5;white-space:nowrap;}
th.icol{text-align:right;padding-right:10px;width:100px;background:var(--s3);}
th.dcol{width:calc((100% - 100px)/6);}
.day-num{font-size:14px;font-weight:800;color:var(--tx);display:block;}
.day-name{font-size:10px;color:var(--tx3);display:block;font-weight:500;}
.today-col{background:var(--acc-light)!important;}
.today-col .day-num{color:var(--acc);}
td.icell{border:1.5px solid var(--b);padding:7px 9px;background:var(--s2);vertical-align:middle;white-space:nowrap;}
.irow{display:flex;align-items:center;gap:7px;}
.iav{width:28px;height:28px;border-radius:50%;background:var(--acc-light);color:var(--acc);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid #bfdbfe;}
.iname{font-size:12px;font-weight:700;color:var(--tx);}
.icity{font-size:9px;color:var(--tx3);}
td.dcell{border:1.5px solid var(--b);padding:3px;vertical-align:top;min-height:68px;transition:background .1s;}
td.dcell.dov{background:var(--acc-light);border-color:var(--acc);}
.cinn{min-height:62px;display:flex;flex-direction:column;gap:2px;}

/* ── CHIPS ── */
.chip{border-radius:6px;padding:4px 7px;border:1.5px solid;cursor:pointer;position:relative;}
.chip-proj{font-size:11px;font-weight:700;display:block;line-height:1.3;color:var(--tc);}
.chip-type{font-size:9px;display:block;color:var(--tc);opacity:.8;font-weight:600;}
.chip-date{font-size:9px;display:block;color:var(--tx3);}
.chip-acts{display:none;gap:2px;margin-top:4px;}
.chip:hover .chip-acts{display:flex;}
.chbtn{background:rgba(0,0,0,.06);border:none;border-radius:3px;padding:2px 6px;font-size:9px;cursor:pointer;color:var(--tc);font-family:'Heebo',sans-serif;font-weight:600;}
.chbtn:hover{background:rgba(0,0,0,.12);}
.addcell{border:1.5px dashed var(--b2);background:transparent;border-radius:6px;padding:3px;width:100%;cursor:pointer;color:var(--tx3);font-size:14px;text-align:center;transition:all .12s;font-family:'Heebo',sans-serif;margin-top:1px;}
.addcell:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-light);}

/* ── STATUS CHIPS ── */
.schip{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid;}
.s-open{background:#eff6ff;color:#2563eb;border-color:#bfdbfe;}
.s-partial{background:#fef3c7;color:#d97706;border-color:#fcd34d;}
.s-done{background:#dcfce7;color:#16a34a;border-color:#86efac;}
.s-cancel{background:#fee2e2;color:#dc2626;border-color:#fca5a5;}

/* ── DRESHOT VIEW ── */
.dview{overflow-y:auto;height:100%;padding-bottom:20px;}
.dview::-webkit-scrollbar{width:5px;}
.dview::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px;}
.dgroup-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px;display:flex;align-items:center;gap:8px;}
.dgroup-title::after{content:'';flex:1;height:1px;background:var(--b);}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-bottom:6px;}
.dcard{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);transition:box-shadow .15s,transform .1s;position:relative;overflow:hidden;}
.dcard::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--tc);}
.dcard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.dcard-type{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);margin-bottom:5px;}
.dcard-proj{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:6px;line-height:1.3;}
.dcard-meta{font-size:11px;color:var(--tx2);line-height:1.7;margin-bottom:8px;}
.dcard-btns{display:flex;gap:5px;flex-wrap:wrap;}
.dbtn{background:var(--s2);border:1.5px solid var(--b);border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--tx2);font-family:'Heebo',sans-serif;font-weight:600;transition:all .12s;}
.dbtn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-light);}
.dbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff;}
.dbtn.pri:hover{background:#1d4ed8;}
.dbtn.del{color:var(--red);}
.dbtn.del:hover{background:var(--red-l);border-color:var(--red);}

/* ── STATS ── */
.stats-area{overflow-y:auto;height:100%;padding-bottom:16px;}
.stats-area::-webkit-scrollbar{width:5px;}
.stats-area::-webkit-scrollbar-thumb{background:var(--b2);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.kpi{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;bottom:0;right:0;left:0;height:3px;background:var(--kc,var(--acc));}
.kpi-label{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.kpi-val{font-size:28px;font-weight:900;color:var(--tx);line-height:1;}
.kpi-sub{font-size:10px;color:var(--tx3);margin-top:4px;}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.charts-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.chart-card{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);}
.cc-title{font-size:11px;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar-label{font-size:11px;color:var(--tx2);width:90px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.bar-track{flex:1;height:10px;background:var(--s2);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bar-val{font-size:11px;color:var(--tx3);width:24px;text-align:left;font-weight:600;}

/* ── SEND MODAL – CALENDAR STYLE ── */
.send-cal{font-family:'Heebo',sans-serif;}
.cal-header{display:grid;grid-template-columns:100px repeat(6,1fr);gap:4px;margin-bottom:4px;}
.cal-hcell{text-align:center;font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;padding:6px 4px;}
.cal-hcell.inst-col{text-align:right;padding-right:8px;}
.cal-grid{display:flex;flex-direction:column;gap:3px;max-height:320px;overflow-y:auto;}
.cal-grid::-webkit-scrollbar{width:4px;}
.cal-grid::-webkit-scrollbar-thumb{background:var(--b2);}
.cal-row{display:grid;grid-template-columns:100px repeat(6,1fr);gap:4px;}
.cal-inst{display:flex;align-items:center;gap:6px;padding:4px 6px;}
.cal-av{width:22px;height:22px;border-radius:50%;background:var(--acc-light);color:var(--acc);font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cal-iname{font-size:11px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-cell{background:var(--s2);border-radius:6px;padding:3px 5px;min-height:36px;border:1px solid var(--b);}
.cal-chip{border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;margin-bottom:2px;color:var(--tc);background:var(--tl);border:1px solid var(--tb);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-empty{color:var(--tx3);font-size:9px;text-align:center;line-height:36px;}

/* ── MODAL ── */
.ov{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.ov.open{display:flex;}
.modal{background:var(--s);border:1.5px solid var(--b);border-radius:var(--rlg);padding:22px 24px;width:420px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal::-webkit-scrollbar{width:4px;}
.modal::-webkit-scrollbar-thumb{background:var(--b2);}
.modal h3{font-size:16px;font-weight:800;color:var(--tx);margin-bottom:18px;}
.mf{margin-bottom:12px;}
.mf label{font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:5px;}
.mf select,.mf input,.mf textarea{width:100%;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:8px 11px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;background:#fff;transition:border-color .15s;}
.mf select:focus,.mf input:focus,.mf textarea:focus{outline:none;border-color:var(--acc);}
.mf textarea{resize:vertical;min-height:60px;}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mrow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1.5px solid var(--b);}
.mbtn{border-radius:var(--rsm);padding:8px 18px;cursor:pointer;font-size:13px;font-family:'Heebo',sans-serif;font-weight:700;border:1.5px solid;transition:all .15s;}
.mbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff;}
.mbtn.pri:hover{background:#1d4ed8;}
.mbtn.can{background:transparent;border-color:var(--b2);color:var(--tx3);}
.mbtn.can:hover{color:var(--tx);border-color:var(--b);}
.section-sep{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:12px 0 6px;border-top:1px solid var(--b);margin-top:4px;}

/* SEND MODAL */
.send-modal{width:700px;max-width:95vw;}
.ichklist{max-height:140px;overflow-y:auto;background:var(--s2);border:1.5px solid var(--b);border-radius:var(--rsm);margin-bottom:12px;}
.ichklist::-webkit-scrollbar{width:3px;}
.ichklist::-webkit-scrollbar-thumb{background:var(--b2);}
.ich{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--b);cursor:pointer;}
.ich:last-child{border-bottom:none;}
.ich:hover{background:var(--acc-light);}
.ich input{cursor:pointer;accent-color:var(--acc);}
.sbtns{display:flex;gap:8px;margin-top:12px;}
.sbtn{flex:1;border:1.5px solid var(--b2);border-radius:var(--rsm);padding:9px;cursor:pointer;font-size:12px;font-family:'Heebo',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
.sbtn.wa{background:#25D366;border-color:#25D366;color:#fff;}
.sbtn.wa:hover{background:#22c55e;}
.sbtn.cp{background:var(--s2);color:var(--tx2);}
.sbtn.cp:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-light);}

/* LOADER */
#ldr{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:800;align-items:center;justify-content:center;flex-direction:column;gap:12px;backdrop-filter:blur(2px);}
#ldr.show{display:flex;}
.spin{width:36px;height:36px;border:3px solid var(--b2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#ldr-msg{font-size:13px;color:var(--tx2);font-weight:600;}

/* NOTIF */

// ═══════════════ STORAGE ═══════════════
function save(){try{localStorage.setItem('mds5',JSON.stringify({chips,dreshyot,installers,nid}));}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('mds5')||'{}');
    if(d.chips)chips=d.chips;
    if(d.dreshyot)dreshyot=d.dreshyot;
    if(d.installers)installers=d.installers;
    if(d.nid)nid=d.nid;
  }catch(e){}
}

// ═══════════════ UTILS ═══════════════
function notify(msg,dur=2500,t=''){
  const el=document.getElementById('notif');el.textContent=msg;el.className='notif show'+(t?' '+t:'');
  setTimeout(()=>el.className='notif',dur);
}
function showLdr(m){document.getElementById('ldr').classList.add('show');document.getElementById('ldr-msg').textContent=m||'...';}
function hideLdr(){document.getElementById('ldr').classList.remove('show');}
function setSyn(s){const d=document.getElementById('sdot'),l=document.getElementById('slbl');d.className='sdot '+s;l.textContent=s==='ok'?'מחובר':s==='load'?'מסנכרן...':'לא מחובר';}
function weekDates(off){
  const base=new Date(2026,4,18);const d0=new Date(base);d0.setDate(base.getDate()+off*7);
  return Array.from({length:6},(_,i)=>{const d=new Date(d0);d.setDate(d0.getDate()+i);return d;});
}
function fmt(d){return d.getDate()+'/'+(d.getMonth()+1);}
function isToday(d){const n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}
function changeWeek(d){weekOff+=d;render();}
function goToday(){weekOff=0;render();}
function ckey(inst,di){return inst+'__'+di+'__'+weekOff;}
function allCPS(){return Object.entries(chips).flatMap(([k,arr])=>{const[i,di,wk]=k.split('__');return arr.map(c=>({...c,inst:i,di:+di,wk:+wk}));});}

// ═══════════════ AUTH ═══════════════
function doLogin(){
  const u=document.getElementById('lu').value;
  const pw=document.getElementById('lpw').value;
  const err=document.getElementById('lerr');
  if(!u){err.textContent='בחר משתמש';err.style.display='block';return;}
  if(PASSWORDS[u]!==pw){err.textContent='סיסמה שגויה';err.style.display='block';document.getElementById('lpw').value='';return;}
  err.style.display='none';
  CU=u;isAdmin=ADMINS.includes(u);
  document.getElementById('ls').style.display='none';
  document.getElementById('app').style.display='grid';
  document.getElementById('unlbl').textContent=CU;
  document.getElementById('rbadge').textContent=isAdmin?'ADMIN':'PM';
  document.getElementById('rbadge').className='rbadge '+(isAdmin?'rba':'rbp');
  if(!isAdmin){
    document.getElementById('btn-sa').style.display='none';
    document.getElementById('btn-si').style.display='none';
    document.getElementById('add-inst-btn').style.display='none';
  }
  load();setSyn('ok');render();notify('ברוך הבא, '+CU+' ✓',2000,'ok');
}
function doLogout(){CU=null;isAdmin=false;document.getElementById('ls').style.display='flex';document.getElementById('app').style.display='none';document.getElementById('lpw').value='';}
function refreshAll(){notify('רועננו ✓',1500,'ok');render();}

// ═══════════════ SELECTS ═══════════════
function visProjs(){return isAdmin?projects:projects.filter(p=>p.pm===CU);}
function fillAmod(data){
  document.getElementById('f-proj').innerHTML=visProjs().map(p=>`<option value="${p.n}">${p.n}</option>`).join('');
  document.getElementById('f-type').innerHTML=TYPES.map(t=>`<option value="${t}">${TYPE_LABELS[t]}</option>`).join('');
  document.getElementById('f-inst').innerHTML='<option value="">-- ללא העדפה --</option>'+installers.map(i=>`<option value="${i.name}">${i.name}</option>`).join('');
  document.getElementById('f-pm').innerHTML=PMS.map(p=>`<option>${p}</option>`).join('');
  ['proj','type','inst','pm','days','notes','date','addr','contact','cphone'].forEach(k=>{
    const el=document.getElementById('f-'+k);if(!el)return;
    el.value=data&&data[k]!==undefined?data[k]:(k==='days'?1:'');
  });
  if(data&&data.proj)document.getElementById('f-proj').value=data.proj;
  if(data&&data.type)document.getElementById('f-type').value=data.type;
  if(!isAdmin)document.getElementById('f-pm').value=CU;
  autopm();
}
function autopm(){const p=projects.find(x=>x.n===document.getElementById('f-proj').value);if(p&&p.pm)document.getElementById('f-pm').value=p.pm;}
function fillDmod(data){
  document.getElementById('df-proj').innerHTML=visProjs().map(p=>`<option value="${p.n}">${p.n}</option>`).join('');
  document.getElementById('df-type').innerHTML=TYPES.map(t=>`<option value="${t}">${TYPE_LABELS[t]}</option>`).join('');
  ['proj','type','qty','days','date','addr','contact','cphone','notes'].forEach(k=>{
    const el=document.getElementById('df-'+k);if(!el)return;
    el.value=data&&data[k]!==undefined?data[k]:(k==='qty'||k==='days'?1:'');
  });
}

function openChipModal(key,ci){
  const c=chips[key]?.[ci];if(!c)return;
  modalCtx={mode:'chip',key,ci};
  document.getElementById('amod-h').textContent='עריכת שיבוץ';
  fillAmod({proj:c.project,type:c.type,inst:c.installer,pm:c.pm,days:c.days,date:c.date,addr:c.addr,contact:c.contact,cphone:c.cphone,notes:c.notes});
  document.getElementById('amod').classList.add('open');
}
function openCellModal(key){
  const parts=key.split('__');
  modalCtx={mode:'cell',key};
  document.getElementById('amod-h').textContent='הוספת שיבוץ – '+parts[0]+', '+DAYS_HE[+parts[1]];
  fillAmod({inst:parts[0]});
  document.getElementById('amod').classList.add('open');
}

  document.getElementById('dmod-h').textContent=d?'עריכת דרשייה':'דרשייה חדשה';

  document.getElementById('dmod').classList.add('open');
}
function closeOv(id){document.getElementById(id).classList.remove('open');}

// ═══════════════ SAVE CHIP ═══════════════
function saveAssignment(){
  const g=id=>document.getElementById(id).value;
  const c={project:g('f-proj'),type:g('f-type'),installer:g('f-inst'),pm:g('f-pm'),days:+g('f-days')||1,date:g('f-date'),addr:g('f-addr'),contact:g('f-contact'),cphone:g('f-cphone'),notes:g('f-notes'),id:'c'+nid++};
  const m=modalCtx;
  if(m.mode==='chip'){if(chips[m.key]?.[m.ci])chips[m.key][m.ci]=c;}
  else{const k=m.key||m.cellKey;if(!chips[k])chips[k]=[];chips[k].push(c);}
  closeOv('amod');save();render();notify('שיבוץ נשמר ✓',1500,'ok');
}
function saveDreshot(){
  const g=id=>document.getElementById(id).value;
  const d={id:'d'+nid++,project:g('df-proj'),type:g('df-type'),qty:+g('df-qty')||1,days:+g('df-days')||1,date:g('df-date'),addr:g('df-addr'),contact:g('df-contact'),cphone:g('df-cphone'),notes:g('df-notes'),status:'פתוח',pm:CU};
  if(modalCtx.id){const idx=dreshyot.findIndex(x=>x.id===modalCtx.id);if(idx>=0)dreshyot[idx]=d;else dreshyot.unshift(d);}
  else dreshyot.unshift(d);
  closeOv('dmod');save();render();notify('דרשייה נשמרה ✓',1500,'ok');
}
function deleteChip(key,ci){chips[key]?.splice(ci,1);save();render();}
function copyChipToReq(key,ci){
  const c=chips[key]?.[ci];if(!c)return;
  dreshyot.unshift({id:'d'+nid++,project:c.project,type:c.type,qty:1,days:c.days,date:c.date,addr:c.addr,contact:c.contact,cphone:c.cphone,notes:c.notes,status:'פתוח',pm:c.pm});
  save();render();notify('הועתק לדרשיות ✓',1500,'ok');
}
function deleteDreshot(id){
  if(!confirm('למחוק דרשייה?'))return;
  dreshyot=dreshyot.filter(x=>x.id!==id);save();render();
}
function scheduleDreshotAs(id){
  const d=dreshyot.find(x=>x.id===id);if(!d)return;
  modalCtx={mode:'cell',key:''};
  document.getElementById('amod-h').textContent='שיבוץ: '+d.project;
  fillAmod({proj:d.project,type:d.type,days:d.days,date:d.date,addr:d.addr,contact:d.contact,cphone:d.cphone,notes:d.notes});
  document.getElementById('amod').classList.add('open');
}

// ═══════════════ DRAG ═══════════════
function dreshotDrag(e,id){dragSrc={t:'dreshot',id};e.dataTransfer.effectAllowed='move';}
function chipDrag(e,key,ci){dragSrc={t:'chip',key,ci};e.dataTransfer.effectAllowed='move';}
function cellOver(e,key){e.preventDefault();document.querySelectorAll('.dcell').forEach(c=>c.classList.remove('dov'));document.querySelector(`[data-key="${key}"]`)?.classList.add('dov');}
function cellDrop(e,key){
  e.preventDefault();document.querySelectorAll('.dcell').forEach(c=>c.classList.remove('dov'));
  if(!dragSrc)return;
  const dates=weekDates(weekOff);const di=+key.split('__')[1];
  const dayDate=dates[di]?dates[di].toISOString().split('T')[0]:'';
  if(dragSrc.t==='dreshot'){
    const d=dreshyot.find(x=>x.id===dragSrc.id);
    if(d){if(!chips[key])chips[key]=[];chips[key].push({id:'c'+nid++,project:d.project,type:d.type,installer:key.split('__')[0],pm:d.pm||CU,days:d.days,date:dayDate,addr:d.addr,contact:d.contact,cphone:d.cphone,notes:d.notes});d.status='שובץ חלקית';}
  }else if(dragSrc.t==='chip'){
    if(dragSrc.key===key){dragSrc=null;return;}
    const c=chips[dragSrc.key]?.[dragSrc.ci];
    if(c){chips[dragSrc.key].splice(dragSrc.ci,1);if(!chips[key])chips[key]=[];chips[key].push({...c,date:dayDate});}
  }
  dragSrc=null;save();render();
}
function dropQueue(e){
  e.preventDefault();
  if(!dragSrc||dragSrc.t!=='chip')return;
  const c=chips[dragSrc.key]?.[dragSrc.ci];
  if(c){chips[dragSrc.key].splice(dragSrc.ci,1);dreshyot.unshift({id:'d'+nid++,project:c.project,type:c.type,qty:1,days:c.days,date:c.date,addr:c.addr,contact:c.contact,cphone:c.cphone,notes:c.notes,status:'פתוח',pm:c.pm});}
  dragSrc=null;save();render();
}
function addInstaller(){
  const n=prompt('שם:');if(!n?.trim())return;
  const ph=prompt('טלפון:','');const ci=prompt('עיר:','');
  installers.push({id:'li'+nid++,name:n.trim(),phone:ph||'',city:ci||''});
  save();render();notify('מתקין נוסף ✓',1500,'ok');
}

// ═══════════════ SEND ═══════════════
function openSend(single){
  document.getElementById('smod-h').textContent=single?'שלח למתקין בודד':'שלח סידור עבודה לכולם';
  const t=document.getElementById('stgts');
  if(single){
    t.innerHTML=`<div class="mf"><label>בחר מתקין</label>
      <select id="ssel" onchange="buildSend(true)" style="border:1.5px solid var(--b2);border-radius:var(--rsm);padding:8px 11px;width:100%;font-family:Heebo,sans-serif;">
      ${installers.map(i=>`<option value="${i.name}">${i.name} ${i.phone?'('+i.phone+')':''}</option>`).join('')}</select></div>`;
  }else{
    t.innerHTML=`<div class="mf"><label>מתקינים לשליחה</label><div class="ichklist">`
      +installers.map(i=>`<div class="ich"><input type="checkbox" id="sc-${i.name}" checked onchange="buildSend(false)"><label for="sc-${i.name}" style="cursor:pointer;font-size:12px;">${i.name} <span style="color:var(--tx3);font-size:10px;">${i.phone||''}</span></label></div>`).join('')
      +'</div></div>';
  }
  document.getElementById('smod').classList.add('open');
  buildSend(single);
}

function buildSend(single){
  const dates=weekDates(weekOff);
  const sel=document.getElementById('ssel');
  const tgts=single&&sel?[sel.value]:installers.map(i=>i.name).filter(n=>{const cb=document.getElementById('sc-'+n);return cb&&cb.checked;});

  // ── Calendar preview ──
  const cph=document.getElementById('cal-preview');
  let calHtml=`<div class="cal-header"><div class="cal-hcell inst-col">מתקין</div>
    ${DAYS_HE.map((d,i)=>`<div class="cal-hcell" style="${isToday(dates[i])?'color:var(--acc);font-weight:900;':''}">${d}<br><span style="font-size:9px;opacity:.7;">${fmt(dates[i])}</span></div>`).join('')}
  </div><div class="cal-grid">`;
  tgts.forEach(nm=>{
    const av=nm.replace(/\s/g,'').slice(0,2);
    calHtml+=`<div class="cal-row">
      <div class="cal-inst"><div class="cal-av">${av}</div><div class="cal-iname">${nm}</div></div>`;
    for(let di=0;di<6;di++){
      const k=ckey(nm,di);const cs=chips[k]||[];
      calHtml+=`<div class="cal-cell ${isToday(dates[di])?'T-תחילת-התקנה':''}">`;
      if(cs.length){
        cs.forEach(c=>{calHtml+=`<div class="cal-chip T-${c.type} tcolor tlbg tborder">${c.project.length>16?c.project.slice(0,15)+'…':c.project}</div>`;});
      }else{calHtml+=`<span class="cal-empty">—</span>`;}
      calHtml+='</div>';
    }
    calHtml+='</div>';
  });
  calHtml+='</div>';
  cph.innerHTML=calHtml;

  // ── Text preview ──
  let txt=`*סידור עבודה – שבוע ${fmt(dates[0])} – ${fmt(dates[5])}*\n${'━'.repeat(28)}\n`;
  let any=false;
  tgts.forEach(nm=>{
    const rows=[];
    DAYS_HE.forEach((day,di)=>{
      const cs=chips[ckey(nm,di)]||[];
      if(!cs.length)return;
      rows.push(`\n  *${day} ${fmt(dates[di])}*`);
      cs.forEach(c=>{
        rows.push(`  • ${c.project} – ${TYPE_LABELS[c.type]||c.type}${c.days>1?', '+c.days+' ימים':''}`);
        if(c.date)rows.push(`    📅 תאריך: ${c.date}`);
        if(c.addr)rows.push(`    📍 כתובת: ${c.addr}`);
        if(c.contact||c.cphone)rows.push(`    👤 איש קשר: ${c.contact||''} ${c.cphone||''}`);
        if(c.notes)rows.push(`    📝 ${c.notes}`);
      });
    });
    if(rows.length){txt+=`\n🔧 *${nm}*${rows.join('\n')}\n`;any=true;}
  });
  if(!any)txt+='\n(אין שיבוצים בשבוע זה)';
  document.getElementById('prevbox').textContent=txt;
}

function sendWA(){
  const txt=document.getElementById('prevbox').textContent;
  const sel=document.getElementById('ssel');
  if(sel){
    const inst=installers.find(i=>i.name===sel.value);
    const ph=(inst?.phone||'').replace(/\D/g,'').replace(/^0/,'972');
    window.open(ph?`https://wa.me/${ph}?text=${encodeURIComponent(txt)}`:`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');
  }else{window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');}
}
function sendCopy(){navigator.clipboard.writeText(document.getElementById('prevbox').textContent).then(()=>notify('הועתק ✓',2000,'ok')).catch(()=>notify('סמן ידנית'));}

function setView(v){view=v;document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',['schedule','dreshot','stats'][i]===v));render();}

// STATS
function renderStats(dates){
  const area=document.getElementById('main');
  const all=allCPS();
  const thisW=all.filter(c=>c.wk===weekOff);
  const totalD=all.reduce((s,c)=>s+c.days,0);
  const thisWD=thisW.reduce((s,c)=>s+c.days,0);
  const instD={};installers.forEach(i=>instD[i.name]=0);
  all.forEach(c=>{if(instD[c.inst]!==undefined)instD[c.inst]+=c.days;});
  const typeD={};TYPES.forEach(t=>typeD[t]=0);
  all.forEach(c=>{if(typeD[c.type]!==undefined)typeD[c.type]+=c.days;});
  const projD={};all.forEach(c=>{projD[c.project]=(projD[c.project]||0)+c.days;});
  const topP=Object.entries(projD).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxI=Math.max(1,...Object.values(instD));
  const openD=dreshyot.filter(d=>d.status==='פתוח').length;
  const partD=dreshyot.filter(d=>d.status==='שובץ חלקית').length;
  const doneD=dreshyot.filter(d=>d.status==='שובץ').length;

  area.innerHTML=`<div class="stats-area">
  <div class="kpis">
    <div class="kpi" style="--kc:var(--acc)"><div class="kpi-label">ימי התקנה סה"כ</div><div class="kpi-val">${totalD}</div><div class="kpi-sub">כל הזמן</div></div>
    <div class="kpi" style="--kc:var(--pur)"><div class="kpi-label">ימי עבודה השבוע</div><div class="kpi-val">${thisWD}</div><div class="kpi-sub">${fmt(dates[0])} – ${fmt(dates[5])}</div></div>
    <div class="kpi" style="--kc:var(--amb)"><div class="kpi-label">דרשיות פתוחות</div><div class="kpi-val" style="color:var(--amb);">${openD}</div><div class="kpi-sub">${partD} שובצו חלקית</div></div>
    <div class="kpi" style="--kc:var(--grn)"><div class="kpi-label">שיבוצים שהושלמו</div><div class="kpi-val" style="color:var(--grn);">${doneD}</div><div class="kpi-sub">מתוך ${dreshyot.length} דרשיות</div></div>
  </div>
  <div class="charts-grid">
    <div class="chart-card"><div class="cc-title">עומס לפי מתקין – ימי עבודה</div>
      ${installers.map(i=>`<div class="bar-row"><div class="bar-label" title="${i.name}">${i.name}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round((instD[i.name]||0)/maxI*100)}%;background:var(--acc);"></div></div><div class="bar-val">${instD[i.name]||0}</div></div>`).join('')}
    </div>
    <div class="chart-card">
      <div class="cc-title">פיזור לפי סוג פעולה</div>
      <div style="position:relative;height:180px;"><canvas id="donut-chart" role="img" aria-label="גרף סוגי פעולות"></canvas></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">
        ${TYPES.map(t=>`<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2);"><span style="width:10px;height:10px;border-radius:3px;background:${TYPE_COLOR[t]};flex-shrink:0;"></span>${TYPE_LABELS[t]} (${typeD[t]||0})</span>`).join('')}
      </div>
    </div>
  </div>
  <div class="charts-grid" style="margin-top:10px;">
    <div class="chart-card"><div class="cc-title">טופ פרויקטים – ימי עבודה</div>
      <div style="position:relative;height:200px;"><canvas id="proj-chart" role="img" aria-label="גרף פרויקטים"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="cc-title">מגמה שבועית</div>
      <div style="position:relative;height:200px;"><canvas id="trend-chart" role="img" aria-label="גרף מגמה שבועית"></canvas></div>
    </div>
  </div>
  </div>`;

  // Draw charts after DOM ready
  requestAnimationFrame(()=>{
    // Donut
    const ctx1=document.getElementById('donut-chart')?.getContext('2d');
    if(ctx1){new Chart(ctx1,{type:'doughnut',data:{labels:TYPES.map(t=>TYPE_LABELS[t]),datasets:[{data:TYPES.map(t=>typeD[t]||0),backgroundColor:TYPES.map(t=>TYPE_COLOR[t]),borderWidth:2,borderColor:'#fff',hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'62%'}});}
    // Bar proj
    const ctx2=document.getElementById('proj-chart')?.getContext('2d');
    if(ctx2){new Chart(ctx2,{type:'bar',data:{labels:topP.map(([p])=>p.length>14?p.slice(0,13)+'…':p),datasets:[{label:'ימים',data:topP.map(([,d])=>d),backgroundColor:'#3b82f6',borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'#e2e6f0'},ticks:{font:{size:10},color:'#94a3b8'}},y:{grid:{display:false},ticks:{font:{size:10},color:'#475569'}}}}});}
    // Trend
    const ctx3=document.getElementById('trend-chart')?.getContext('2d');
    if(ctx3){
      const wks=[...new Set(all.map(c=>c.wk))].sort((a,b)=>a-b).slice(-6);
      const wkDays=wks.map(wk=>all.filter(c=>c.wk===wk).reduce((s,c)=>s+c.days,0));
      const wkLabels=wks.map(wk=>{const d=weekDates(wk);return fmt(d[0]);});
      new Chart(ctx3,{type:'line',data:{labels:wkLabels,datasets:[{label:'ימי עבודה',data:wkDays,borderColor:'#7c3aed',backgroundColor:'#7c3aed15',borderWidth:2.5,fill:true,tension:.4,pointRadius:5,pointBackgroundColor:'#7c3aed',pointBorderColor:'#fff',pointBorderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#e2e6f0'},ticks:{font:{size:10},color:'#94a3b8'}},y:{grid:{color:'#e2e6f0'},ticks:{font:{size:10},color:'#94a3b8'}}}}});
    }
  });
}
