<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyDesk - שיבוץ מתקינים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',Arial,sans-serif;background:#f0f4f8;color:#0f172a;direction:rtl;font-size:13px;}
.hidden{display:none!important;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box{background:#fff;border-radius:16px;padding:36px 40px;width:340px;box-shadow:0 20px 40px rgba(0,0,0,.2);}
.login-logo{font-size:28px;font-weight:900;color:#0f172a;margin-bottom:20px;text-align:center;}
.login-logo span{color:#2563eb;}
.login-box h2{font-size:16px;font-weight:700;margin-bottom:4px;}
.login-box p{color:#94a3b8;font-size:12px;margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px;}
.field select,.field input{width:100%;border:1.5px solid #cbd5e1;border-radius:6px;padding:9px 12px;font-size:13px;font-family:'Heebo',Arial,sans-serif;color:#0f172a;background:#fff;}
.field select:focus,.field input:focus{outline:none;border-color:#2563eb;}
.login-err{color:#dc2626;font-size:12px;margin-top:6px;}
.login-btn{width:100%;background:#2563eb;border:none;border-radius:6px;padding:11px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Heebo',Arial,sans-serif;margin-top:4px;}
.login-btn:hover{background:#1d4ed8;}

/* APP */
#app-screen{display:none;height:100vh;flex-direction:column;}
#app-screen.active{display:flex;}
.topbar{background:#fff;border-bottom:1.5px solid #e2e8f0;padding:0 14px;height:52px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.topbar-logo{font-size:15px;font-weight:900;color:#0f172a;}
.topbar-logo span{color:#2563eb;}
.top-sep{width:1px;height:20px;background:#e2e8f0;}
.top-tabs{display:flex;gap:1px;background:#f8fafc;padding:3px;border-radius:8px;}
.top-tab{padding:4px 12px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:#64748b;font-family:'Heebo',Arial,sans-serif;}
.top-tab.active{background:#fff;color:#2563eb;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.top-week{display:flex;align-items:center;gap:5px;margin-right:auto;}
.top-wbtn{background:#f8fafc;border:1.5px solid #e2e8f0;color:#475569;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px;font-weight:700;}
.top-wlbl{font-size:13px;font-weight:600;min-width:130px;text-align:center;color:#0f172a;}
.top-btn{background:#f8fafc;border:1.5px solid #e2e8f0;color:#475569;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:'Heebo',Arial,sans-serif;font-weight:500;white-space:nowrap;}
.top-btn:hover{border-color:#2563eb;color:#2563eb;}
.top-btn.green{background:#16a34a;border-color:#16a34a;color:#fff;font-weight:700;}
.user-chip{display:flex;align-items:center;gap:5px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;}
.user-dot{width:7px;height:7px;border-radius:50%;background:#16a34a;}
.role-badge{border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;}
.badge-admin{background:#ede9fe;color:#7c3aed;border:1px solid #c4b5fd;}
.badge-pm{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;}

/* BODY */
.app-body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:270px;background:#fff;border-left:1.5px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
.sb-head{padding:9px 12px;font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.07em;text-transform:uppercase;border-bottom:1.5px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;background:#f8fafc;flex-shrink:0;}
.sb-add-btn{background:#2563eb;border:none;border-radius:5px;padding:3px 9px;font-size:11px;color:#fff;cursor:pointer;font-family:'Heebo',Arial,sans-serif;font-weight:700;}
.sb-list{overflow-y:auto;flex:1;padding:7px;}
.sb-footer{padding:8px;border-top:1.5px solid #e2e8f0;flex-shrink:0;}

.main-area{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:10px 12px;gap:8px;}

/* REQUEST CARDS */
.req-card{border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:grab;border:1.5px solid #e2e8f0;background:#fff;user-select:none;}
.req-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);}
.req-stripe{height:3px;border-radius:2px;margin-bottom:7px;}
.req-type{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;}
.req-proj{font-weight:700;font-size:12px;line-height:1.3;margin-bottom:3px;color:#0f172a;}
.req-meta{font-size:10px;color:#475569;line-height:1.7;}
.req-btns{display:flex;gap:3px;margin-top:6px;}
.req-btn{background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;color:#475569;font-family:'Heebo',Arial,sans-serif;}
.req-btn:hover{background:#eff6ff;color:#2563eb;border-color:#2563eb;}
.req-btn.del{color:#dc2626;}
.status-pill{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid;}
.sp-open{background:#eff6ff;color:#2563eb;border-color:#bfdbfe;}
.sp-partial{background:#fef3c7;color:#d97706;border-color:#fcd34d;}
.sp-done{background:#dcfce7;color:#16a34a;border-color:#86efac;}

/* MATRIX */
.matrix-wrap{flex:1;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;overflow:auto;}
table{border-collapse:collapse;width:100%;table-layout:fixed;}
th{font-size:10px;font-weight:700;color:#64748b;text-align:center;padding:8px 3px;background:#f8fafc;border:1.5px solid #e2e8f0;position:sticky;top:0;z-index:5;white-space:nowrap;}
th.col-inst{text-align:right;padding-right:8px;width:100px;background:#eef2f7;}
th.col-day{width:calc((100% - 100px)/6);}
th.today-hdr{background:#eff6ff!important;color:#2563eb!important;}
.day-num{font-size:12px;font-weight:800;color:#0f172a;display:block;}
.day-name{font-size:10px;color:#94a3b8;display:block;font-weight:500;}
td.td-inst{border:1.5px solid #e2e8f0;padding:6px 8px;background:#f8fafc;vertical-align:middle;white-space:nowrap;}
.inst-row{display:flex;align-items:center;gap:6px;}
.inst-av{width:26px;height:26px;border-radius:50%;background:#eff6ff;color:#2563eb;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #bfdbfe;}
.inst-name{font-size:12px;font-weight:700;color:#0f172a;}
.inst-city{font-size:9px;color:#94a3b8;}
td.td-day{border:1.5px solid #e2e8f0;padding:3px;vertical-align:top;min-height:66px;transition:background .1s;}
td.td-day.today-cell{background:#f0f7ff;}
td.td-day.drag-over{background:#eff6ff;border-color:#2563eb;}
td.td-day.off-day{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 5px,#eef2f7 5px,#eef2f7 10px);}
.cell-inner{min-height:60px;display:flex;flex-direction:column;gap:2px;}
.off-label{text-align:center;font-size:9px;font-weight:700;color:#94a3b8;padding:8px 0;}

/* CHIPS */
.chip{border-radius:5px;padding:4px 6px;border:1.5px solid;cursor:pointer;position:relative;}
.chip-proj{font-size:11px;font-weight:700;display:block;line-height:1.3;}
.chip-sub{font-size:9px;display:block;opacity:.8;font-weight:600;}
.chip-date{font-size:9px;display:block;color:#94a3b8;}
.chip-actions{display:none;gap:2px;margin-top:3px;}
.chip:hover .chip-actions{display:flex;}
.chip-btn{background:rgba(0,0,0,.06);border:none;border-radius:3px;padding:2px 5px;font-size:9px;cursor:pointer;font-family:'Heebo',Arial,sans-serif;font-weight:600;}
.add-cell-btn{border:1.5px dashed #cbd5e1;background:transparent;border-radius:5px;padding:3px;width:100%;cursor:pointer;color:#94a3b8;font-size:12px;text-align:center;font-family:'Heebo',Arial,sans-serif;margin-top:1px;}
.add-cell-btn:hover{border-color:#2563eb;color:#2563eb;background:#eff6ff;}
.add-cell-btn.dreshot{border-color:#16a34a;color:#16a34a;}
.add-cell-btn.dreshot:hover{background:#dcfce7;}
.off-btn{border:1px solid #fca5a5;background:#fff0f0;border-radius:5px;padding:2px;width:100%;cursor:pointer;color:#dc2626;font-size:10px;text-align:center;font-family:'Heebo',Arial,sans-serif;margin-top:1px;}

/* DRESHOT VIEW */
.dreshot-view{overflow-y:auto;height:100%;padding-bottom:20px;}
.dg-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px;display:flex;align-items:center;gap:8px;}
.dg-title::after{content:'';flex:1;height:1px;background:#e2e8f0;}
.dreshot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-bottom:6px;}
.dreshot-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 14px;position:relative;overflow:hidden;}
.dreshot-card::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;}
.dreshot-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);}
.dc-type{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;}
.dc-proj{font-size:13px;font-weight:700;margin-bottom:6px;color:#0f172a;}
.dc-meta{font-size:11px;color:#475569;line-height:1.7;margin-bottom:8px;}
.dc-btns{display:flex;gap:5px;flex-wrap:wrap;}
.dc-btn{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;color:#475569;font-family:'Heebo',Arial,sans-serif;font-weight:600;}
.dc-btn:hover{border-color:#2563eb;color:#2563eb;background:#eff6ff;}
.dc-btn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
.dc-btn.del{color:#dc2626;}
.dc-btn.del:hover{background:#fee2e2;border-color:#dc2626;}

/* STATS */
.stats-view{overflow-y:auto;height:100%;padding-bottom:20px;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.kpi-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:13px 15px;position:relative;overflow:hidden;}
.kpi-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;}
.kpi-label{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.kpi-value{font-size:26px;font-weight:900;color:#0f172a;}
.kpi-sub{font-size:10px;color:#94a3b8;margin-top:3px;}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chart-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:14px;}
.chart-title{font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.bar-label{font-size:11px;color:#475569;width:88px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.bar-track{flex:1;height:9px;background:#f1f5f9;border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;transition:width .4s;}
.bar-value{font-size:11px;color:#94a3b8;width:22px;text-align:left;font-weight:600;}

/* LEGEND */
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 4px;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#475569;font-weight:500;}
.leg-dot{width:10px;height:10px;border-radius:3px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:22px 24px;width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.15);}
.modal-box h3{font-size:15px;font-weight:800;margin-bottom:16px;}
.mfield{margin-bottom:11px;}
.mfield label{font-size:10px;font-weight:800;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px;}
.mfield select,.mfield input,.mfield textarea{width:100%;border:1.5px solid #cbd5e1;border-radius:6px;padding:8px 11px;color:#0f172a;font-family:'Heebo',Arial,sans-serif;font-size:13px;background:#fff;}
.mfield select:focus,.mfield input:focus,.mfield textarea:focus{outline:none;border-color:#2563eb;}
.mfield textarea{resize:vertical;min-height:60px;}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.msep{font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;padding:10px 0 6px;border-top:1px solid #e2e8f0;margin-top:4px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1.5px solid #e2e8f0;}
.mbtn{border-radius:6px;padding:8px 18px;cursor:pointer;font-size:13px;font-family:'Heebo',Arial,sans-serif;font-weight:700;border:1.5px solid;}
.mbtn.pri{background:#2563eb;border-color:#2563eb;color:#fff;}
.mbtn.pri:hover{background:#1d4ed8;}
.mbtn.can{background:transparent;border-color:#cbd5e1;color:#94a3b8;}
.mbtn.danger{background:#dc2626;border-color:#dc2626;color:#fff;}

/* INST PICKER */
.inst-picker{background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:6px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;min-height:40px;}
.inst-tag{cursor:pointer;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid #cbd5e1;background:#fff;color:#475569;transition:all .12s;}
.inst-tag.selected{background:#2563eb;color:#fff;border-color:#2563eb;}

/* SEND */
.send-modal{width:750px;max-width:95vw;}
.send-checklist{max-height:130px;overflow-y:auto;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:6px;margin-bottom:12px;}
.send-check-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #e2e8f0;cursor:pointer;}
.send-check-item:last-child{border-bottom:none;}
.send-check-item:hover{background:#eff6ff;}
.send-check-item input{accent-color:#2563eb;cursor:pointer;}
.cal-table{border-collapse:collapse;width:100%;min-width:540px;}
.cal-table th{font-size:10px;font-weight:700;color:#64748b;text-align:center;padding:6px 3px;background:#f8fafc;border:1px solid #e2e8f0;}
.cal-table th.cal-inst-th{text-align:right;padding-right:8px;width:85px;}
.cal-table td{border:1px solid #e2e8f0;padding:3px;vertical-align:top;height:48px;background:#fff;}
.cal-table td.cal-inst-td{background:#f8fafc;padding:5px 7px;vertical-align:middle;}
.cal-chip{display:block;border-radius:3px;padding:2px 5px;font-size:9px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-today-td{background:#eff6ff!important;}
.preview-text{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:6px;padding:10px 12px;font-size:11px;line-height:1.8;max-height:150px;overflow-y:auto;white-space:pre-wrap;font-family:'Heebo',Arial,sans-serif;color:#0f172a;}
.send-btns{display:flex;gap:8px;margin-top:12px;}
.send-btn{flex:1;border:1.5px solid #cbd5e1;border-radius:6px;padding:9px;cursor:pointer;font-size:12px;font-family:'Heebo',Arial,sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}
.send-btn.wa{background:#25D366;border-color:#25D366;color:#fff;}
.send-btn.cp{background:#f8fafc;color:#475569;}
.send-btn.cp:hover{border-color:#2563eb;color:#2563eb;background:#eff6ff;}

/* FILE */
.file-upload{border:2px dashed #cbd5e1;border-radius:6px;padding:12px;text-align:center;cursor:pointer;transition:all .15s;}
.file-upload:hover{border-color:#2563eb;background:#eff6ff;}
.file-upload input{display:none;}
.file-upload p{font-size:12px;color:#94a3b8;}
.file-preview{display:flex;align-items:center;gap:8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:7px 10px;margin-top:6px;}
.file-preview span{font-size:11px;color:#2563eb;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.file-preview button{background:none;border:none;cursor:pointer;color:#dc2626;font-size:14px;}

/* NOTIF */
.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 22px;font-size:12px;font-weight:700;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.1);white-space:nowrap;}
.notif.show{opacity:1;}
.notif.ok{border-color:#86efac;color:#16a34a;}
.notif.err{border-color:#fca5a5;color:#dc2626;}
.off-reason-btn{border:1.5px solid #e2e8f0;border-radius:8px;padding:10px 8px;cursor:pointer;font-size:13px;font-family:'Heebo',Arial,sans-serif;font-weight:600;background:#fff;color:#475569;transition:all .15s;text-align:center;}
.off-reason-btn:hover{border-color:#2563eb;background:#eff6ff;color:#2563eb;}
.off-reason-btn.selected{border-color:#2563eb;background:#2563eb;color:#fff;}
</style>
</head>
<body>
<div class="notif" id="notif"></div>

<!-- ==================== LOGIN ==================== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">my<span>desk</span> &#128197;</div>
    <h2>כניסה למערכת</h2>
    <p>בחר שם והזן סיסמה</p>
    <div class="field">
      <label>משתמש</label>
      <select id="sel-user">
        <option value="">-- בחר שם --</option>
        <option value="admin">ניר (אדמין)</option>
        <option value="galad">גלעד</option>
        <option value="amit">עמית</option>
        <option value="idan">עידן</option>
        <option value="niki">ניקי</option>
        <option value="shai">שי</option>
        <option value="chen">חן שאמלי</option>
        <option value="asaf">אסף כרמונה</option>
        <option value="vova">וובה</option>
        <option value="sapir">ספיר בר</option>
        <option value="asaft">אסף טישלר</option>
      </select>
    </div>
    <div class="field" id="pw-wrap" style="display:none;">
      <label>סיסמה (רק לאדמין)</label>
      <input type="password" id="inp-pw" placeholder="הזן סיסמה">
      <div class="login-err" id="login-err" style="display:none;">סיסמה שגויה</div>
    </div>
    <button class="login-btn" id="login-btn">כניסה</button>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-logo">my<span>desk</span></div>
    <div class="top-sep"></div>
    <div class="top-tabs">
      <button class="top-tab active" id="tab-schedule">&#128197; לוח שיבוץ</button>
      <button class="top-tab" id="tab-dreshot">&#128203; דרישות</button>
      <button class="top-tab" id="tab-absence">&#128274; היעדרויות</button>
      <button class="top-tab" id="tab-stats">&#128202; סטטיסטיקות</button>
    </div>
    <div class="top-week">
      <button class="top-wbtn" id="btn-prev-week">&#8250;</button>
      <span class="top-wlbl" id="week-label"></span>
      <button class="top-wbtn" id="btn-next-week">&#8249;</button>
      <button class="top-wbtn" id="btn-today" style="font-size:10px;font-weight:700;">היום</button>
    </div>
    <button class="top-btn" id="btn-send-all">&#9993; לכולם</button>
    <button class="top-btn" id="btn-send-one">&#128100; למתקין</button>
    <button class="top-btn green" id="btn-new-dreshot">+ דרשיה</button>
    <div class="user-chip"><span class="user-dot"></span><span id="lbl-user"></span></div>
    <span class="role-badge" id="lbl-role"></span>

function typeColor(typeId) {

  return "#2563eb";

function notify(msg, type) {

function weekDates(off) {
  var base = new Date(2026, 4, 18);
  var d0 = new Date(base);
  d0.setDate(base.getDate() + off*7);
  var res = [];
  for (var i=0; i<6; i++) {
    var d = new Date(d0);
    d.setDate(d0.getDate() + i);
    res.push(d);
  }
  return res;
}
function fmtDate(d) { return d.getDate() + "/" + (d.getMonth()+1); }
function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function pad(n) { return n < 10 ? "0"+n : ""+n; }
function isToday(d) {
  var n = new Date();
  return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}
function cellKey(instName, dayIdx) { return instName + "__" + dayIdx + "__" + weekOffset; }
function offKey(instName, isoD) { return instName + "__" + isoD; }
function allChips() {
  var res = [];
  Object.keys(chips).forEach(function(k) {
    var parts = k.split("__");
    var arr = chips[k] || [];
    arr.forEach(function(c) {
      res.push(Object.assign({}, c, {inst:parts[0], di:parseInt(parts[1]), wk:parseInt(parts[2])}));
    });
  });
  return res;
}

function renderSchedule() {
  var dates = weekDates(weekOffset);
  var legHTML = TYPES.map(function(t) {
    return '<span class="leg-item"><span class="leg-dot" style="background:'+t.color+'"></span>'+t.label+'</span>';
  }).join("");
  var headHTML = DAYS.map(function(d, i) {
    var tod = isToday(dates[i]);
    return '<th class="col-day'+(tod?' today-hdr':'')+'"><span class="day-num">'+d+'</span><span class="day-name">'+fmtDate(dates[i])+'</span></th>';
  }).join("");
  var bodyHTML = INSTALLERS.map(function(inst) {
    var av = inst.name.replace(/\s/g,"").substring(0,2);
    var tdHTML = dates.map(function(date, di) {
      var key = cellKey(inst.name, di);
      var off = !!offDays[offKey(inst.name, isoDate(date))];
      if (off) {
        var reason = offDays[offKey(inst.name, isoDate(date))];
        return '<td class="td-day off-day'+(isToday(date)?' today-cell':'')+'" data-key="'+key+'">' +
          '<div class="off-label">'+reason+'</div>' +
          (isAdmin ? '<button class="req-btn" style="width:100%;font-size:9px;" onclick="removeOff(\''+inst.name+'\',\''+isoDate(date)+'\')">פתח</button>' : '') +
          '</td>';
      }
      var cs = chips[key] || [];
      var chipsHTML = cs.map(function(c, ci) {
        var col = typeColor(c.type);
        var canEdit = isAdmin || c.pm === currentUser;
        return '<div class="chip" style="background:'+col+'18;border-color:'+col+'35;" data-key="'+key+'" data-ci="'+ci+'" draggable="'+canEdit+'">' +
          '<span class="chip-proj" style="color:'+col+'">'+c.proj+'</span>' +
          '<span class="chip-sub" style="color:'+col+'">'+typeLabel(c.type)+(c.days>1?' · '+c.days+'י':'')+'</span>' +
          (c.date ? '<span class="chip-date">📅 '+c.date+'</span>' : '') +
          (canEdit ? '<div class="chip-actions">' +
            '<button class="chip-btn" style="color:'+col+';" onclick="openChipEdit(\''+key+'\','+ci+')">✏</button>' +
            '<button class="chip-btn" style="color:'+col+';" onclick="copyChipToDreshot(\''+key+'\','+ci+')">⎘</button>' +
            '<button class="chip-btn" style="color:'+col+';" onclick="deleteChip(\''+key+'\','+ci+')">✕</button>' +
          '</div>' : '') +
          '</div>';
      }).join("");
      return '<td class="td-day'+(isToday(date)?' today-cell':'')+(off?' off-day':'')+'" data-key="'+key+'" ondragover="handleDragOver(event,\''+key+'\')" ondrop="handleDrop(event,\''+key+'\')">' +
        '<div class="cell-inner">' + chipsHTML +
        (isAdmin ? '<button class="add-cell-btn" onclick="openChipNew(\''+key+'\',\''+inst.name+'\')">+ שבץ</button>' +
          '<button class="off-btn" onclick="openOffModal(\''+inst.name+'\',\''+fmtDate(date)+'\',\''+isoDate(date)+'\')">🔴 חופש</button>' :
          '<button class="add-cell-btn dreshot" onclick="openDreshotModal(null)">+ דרשיה</button>') +
        '</div></td>';
    }).join("");
    return '<tr>' +
      '<td class="td-inst"><div class="inst-row">' +
      '<div class="inst-av">'+av+'</div>' +
      '<div><div class="inst-name">'+inst.name+'</div><div class="inst-city">'+inst.city+'</div></div>' +
      '</div></td>' + tdHTML + '</tr>';
  }).join("");

  var area = document.getElementById("main-area");
  area.innerHTML =
    '<div class="legend">'+legHTML+'</div>' +
    '<div class="matrix-wrap"><table>' +
    '<thead><tr><th class="col-inst">מתקין</th>'+headHTML+'</tr></thead>' +
    '<tbody>'+bodyHTML+'</tbody></table></div>';

  // chip drag events
  area.querySelectorAll(".chip[draggable='true']").forEach(function(chip) {
    chip.addEventListener("dragstart", function(e) {
      dragSrc = {type:"chip", key:chip.dataset.key, ci:parseInt(chip.dataset.ci)};
      e.dataTransfer.effectAllowed = "move";
    });
  });
}

function handleDragOver(e, key) {
  e.preventDefault();
  document.querySelectorAll(".td-day").forEach(function(td){ td.classList.remove("drag-over"); });
  var td = document.querySelector('[data-key="'+key+'"]');
  if (td) td.classList.add("drag-over");
}
function handleDrop(e, key) {
  e.preventDefault();
  document.querySelectorAll(".td-day").forEach(function(td){ td.classList.remove("drag-over"); });
  if (!dragSrc) return;
  var parts = key.split("__");
  var di = parseInt(parts[1]);
  var dates = weekDates(weekOffset);
  var dayIso = isoDate(dates[di]);
  var instName = parts[0];
  if (dragSrc.type === "dreshot") {
    var dr = dreshyot.filter(function(d){ return d.id === dragSrc.id; })[0];
    if (dr) {
      if (!chips[key]) chips[key] = [];
      chips[key].push({id:"c"+nextId++, proj:dr.proj, type:dr.type, days:dr.days, date:dayIso, insts:[instName], pm:dr.pm||currentUser, addr:dr.addr, contact:dr.contact, cphone:dr.cphone, notes:dr.notes, fileId:dr.fileId||null});
      dr.status = "חלקי";
    }
  } else if (dragSrc.type === "chip") {
    if (dragSrc.key === key) { dragSrc=null; return; }
    var srcChips = chips[dragSrc.key] || [];
    var chip = srcChips[dragSrc.ci];
    if (chip) {
      srcChips.splice(dragSrc.ci, 1);
      if (!chips[key]) chips[key] = [];
      chips[key].push(Object.assign({}, chip, {date:dayIso}));
    }
  }
  dragSrc = null;
  saveData(); renderAll();
}

document.getElementById("sb-list").addEventListener("dragover", function(e){ e.preventDefault(); });
document.getElementById("sb-list").addEventListener("drop", function(e) {

  }
  dragSrc = null;
  saveData(); renderAll();
});

function fillChipSelects() {

  // inst picker
  var picker = document.getElementById("chip-inst-picker");
  picker.innerHTML = INSTALLERS.map(function(inst) {
    var sel = selectedInsts.indexOf(inst.name) >= 0;
    return '<span class="inst-tag'+(sel?' selected':'\"')+'\" data-name="'+inst.name+'">'+inst.name+'</span>';
  }).join("");
  picker.querySelectorAll(".inst-tag").forEach(function(tag) {
    tag.addEventListener("click", function() {
      var name = tag.dataset.name;

      var n = tag.dataset.name;
      var idx = selectedDrInsts.indexOf(n);

  });
}

function setupFile(inputId, previewId, nameId, clearId, areaId) {
  document.getElementById(areaId).addEventListener("click", function(){ document.getElementById(inputId).click(); });
  document.getElementById(inputId).addEventListener("change", function() {
    var f = this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(e) {
      var fid = "f" + nextId++;
      fileStore[fid] = {name:f.name, dataUrl:e.target.result};
      document.getElementById(inputId).dataset.fid = fid;
      document.getElementById(previewId).style.display = "flex";
      document.getElementById(nameId).textContent = f.name;
    };
    r.readAsDataURL(f);
  });
  document.getElementById(clearId).addEventListener("click", function(e) {
    e.stopPropagation();
    document.getElementById(inputId).value = "";
    document.getElementById(inputId).dataset.fid = "";
    document.getElementById(previewId).style.display = "none";
  });
}

function getSendTargets() {
  if (sendSingle) {
    var sel = document.getElementById("sel-send-inst");

  }
  return INSTALLERS.map(function(i){ return i.name; }).filter(function(n){
    var cb = document.getElementById("sch-"+n);
    return cb && cb.checked;
  });
}

function buildSend() {
  var dates = weekDates(weekOffset);
  var targets = getSendTargets();
  // Calendar
  var calHTML = '<table class="cal-table"><thead><tr>' +
    '<th class="cal-inst-th">מתקין</th>' +
    DAYS.map(function(d,i){ return '<th style="'+(isToday(dates[i])?'color:#2563eb;background:#eff6ff;':'')+'">' + d + '<br><span style="font-weight:400;font-size:9px;">'+fmtDate(dates[i])+'</span></th>'; }).join("") +
    '</tr></thead><tbody>';
  targets.forEach(function(name) {
    var av = name.replace(/\s/g,"").substring(0,2);
    var instInfo = INSTALLERS.filter(function(i){ return i.name===name; })[0] || {};
    calHTML += '<tr><td class="cal-inst-td"><div style="display:flex;align-items:center;gap:5px;">' +
      '<div style="width:22px;height:22px;border-radius:50%;background:#eff6ff;color:#2563eb;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;">'+av+'</div>' +
      '<div><div style="font-size:11px;font-weight:700;">'+name+'</div><div style="font-size:9px;color:#94a3b8;">'+(instInfo.phone||'')+'</div></div>' +
      '</div></td>';
    dates.forEach(function(date, di) {
      var key = cellKey(name, di);
      var cs = chips[key] || [];
      var off = offDays[offKey(name, isoDate(date))];
      calHTML += '<td class="'+(isToday(date)?'cal-today-td':'')+'">';
      if (off) { calHTML += '<span style="font-size:9px;color:#94a3b8;font-weight:700;">'+off+'</span>'; }
      else { cs.forEach(function(c){ var col=typeColor(c.type); calHTML += '<span class="cal-chip" style="background:'+col+'18;border:1px solid '+col+'40;color:'+col+';">'+(c.proj.length>14?c.proj.substring(0,13)+'...':c.proj)+'</span>'; }); }
      calHTML += '</td>';
    });
    calHTML += '</tr>';
  });
  calHTML += '</tbody></table>';
  document.getElementById("cal-preview").innerHTML = calHTML;

  // Text
  var txt = "*סידור עבודה - שבוע " + fmtDate(dates[0]) + " - " + fmtDate(dates[5]) + "*\n" + "---".repeat(10) + "\n";
  var any = false;
  targets.forEach(function(name) {
    var instInfo = INSTALLERS.filter(function(i){ return i.name===name; })[0] || {};
    var rows = [];
    DAYS.forEach(function(day, di) {
      var cs = chips[cellKey(name, di)] || [];
      var off = offDays[offKey(name, isoDate(dates[di]))];
      if (off) { rows.push("\n  *" + day + " " + fmtDate(dates[di]) + "* - " + off); }
      else if (cs.length) {
        rows.push("\n  *" + day + " " + fmtDate(dates[di]) + "*");
        cs.forEach(function(c) {
          rows.push("  - " + c.proj + " - " + typeLabel(c.type) + (c.days>1 ? ", "+c.days+" ימים" : ""));
          if (c.pm) rows.push("    👤 מנהל פרויקט: " + c.pm);
          if (c.addr) rows.push("    📍 " + c.addr);
          if (c.contact||c.cphone) rows.push("    👤 " + (c.contact||"") + " " + (c.cphone||""));
          if (c.notes) rows.push("    📝 " + c.notes);
          if (c.fileId && fileStore[c.fileId]) rows.push("    📎 " + fileStore[c.fileId].name);
        });
      }
    });
    if (rows.length) { txt += "\n🔧 *" + name + "*" + (instInfo.phone?" | "+instInfo.phone:"") + rows.join("\n") + "\n"; any=true; }
  });
  if (!any) txt += "\n(אין שיבוצים בשבוע זה)";
  document.getElementById("preview-text").textContent = txt;
}

function sendWA() {
  var txt = document.getElementById("preview-text").textContent;
  if (sendSingle) {
    var sel = document.getElementById("sel-send-inst");
    if (sel) {
      var inst = INSTALLERS.filter(function(i){ return i.name===sel.value; })[0];
      var ph = inst && inst.phone ? inst.phone.replace(/\D/g,"").replace(/^0/,"972") : "";
      if (ph) { window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(txt),"_blank"); return; }
    }
  }
  window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
}
function sendCopy() {
  navigator.clipboard.writeText(document.getElementById("preview-text").textContent)
    .then(function(){ notify("הועתק!", "ok"); })
    .catch(function(){ notify("סמן ידנית"); });
}

// ==================== DRESHOT VIEW ====================
function renderDreshot() {
  var vis = isAdmin ? dreshyot : dreshyot.filter(function(d){ return d.pm===currentUser; });
  var area = document.getElementById("main-area");
  if (!vis.length) {
    area.innerHTML = '<div style="color:#94a3b8;padding:40px;text-align:center;font-size:14px;">אין דרישות. <button class="dc-btn pri" onclick="openDreshotModal(null)" style="margin-right:10px;">+ הוסף</button></div>';
    return;
  }
  var byStatus = {open:[], partial:[], done:[]};
  vis.forEach(function(d) {
    if (d.status==="פתוח") byStatus.open.push(d);
    else if (d.status==="חלקי") byStatus.partial.push(d);
    else byStatus.done.push(d);
  });
  function dCard(d) {
    var col = typeColor(d.type);
    return '<div class="dreshot-card" style="border-left:3px solid '+col+';">' +
      '<div class="dc-type" style="color:'+col+'">'+typeLabel(d.type)+'</div>' +
      '<div class="dc-proj">'+d.proj+'</div>' +
      '<div class="dc-meta">'+(d.date?'📅 '+d.date+' · ':'')+d.qty+' מתקינים · '+d.days+' ימים'+(d.preferredInst?'<br>👤 מועדף: '+d.preferredInst:'')+(d.addr?'<br>📍 '+d.addr:'')+(d.contact?'<br>👤 '+d.contact+' '+(d.cphone||''):'')+(d.notes?'<br>📝 '+d.notes.substring(0,55):'')+' </div>' +
      '<span class="status-pill '+(d.status==="פתוח"?"sp-open":d.status==="חלקי"?"sp-partial":"sp-done")+'">'+d.status+'</span>' +
      '<div class="dc-btns" style="margin-top:8px;">' +
      '<button class="dc-btn" onclick="openDreshotModal(\''+d.id+'\')">✏ עריכה</button>' +
      '<button class="dc-btn pri" onclick="scheduleDreshot(\''+d.id+'\')">📌 שבץ</button>' +
      '<button class="dc-btn del" onclick="deleteDreshot(\''+d.id+'\')">✕</button>' +
      '</div></div>';
  }
  var html = '<div class="dreshot-view">';
  if (byStatus.open.length) html += '<div class="dg-title" style="color:#2563eb;">פתוחות <span style="background:#eff6ff;color:#2563eb;border-radius:20px;padding:1px 8px;font-size:10px;">'+byStatus.open.length+'</span></div><div class="dreshot-grid">'+byStatus.open.map(dCard).join("")+'</div>';
  if (byStatus.partial.length) html += '<div class="dg-title" style="color:#d97706;">שובצו חלקית <span style="background:#fef3c7;color:#d97706;border-radius:20px;padding:1px 8px;font-size:10px;">'+byStatus.partial.length+'</span></div><div class="dreshot-grid">'+byStatus.partial.map(dCard).join("")+'</div>';
  if (byStatus.done.length) html += '<div class="dg-title" style="color:#16a34a;">הושלמו <span style="background:#dcfce7;color:#16a34a;border-radius:20px;padding:1px 8px;font-size:10px;">'+byStatus.done.length+'</span></div><div class="dreshot-grid" style="opacity:.65;">'+byStatus.done.map(dCard).join("")+'</div>';
  html += '</div>';
  area.innerHTML = html;
}

// ==================== STATS ====================
function renderAbsence() {
  var area = document.getElementById("main-area");
  var dates = weekDates(weekOffset);
  // Build week navigation title
  var html = '<div style="display:flex;flex-direction:column;gap:12px;height:100%;overflow:auto;padding-bottom:20px;">';

  // ── Add absence row ──
  html += '<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">';
  html += '<div style="font-size:13px;font-weight:700;color:#0f172a;">ניהול היעדרויות – שבוע ' + fmtDate(dates[0]) + ' – ' + fmtDate(dates[5]) + '</div>';
  html += '<button class="mbtn pri" onclick="openAddAbsence()" style="padding:6px 14px;font-size:12px;">+ הוסף היעדרות</button>';
  html += '</div>';

  // ── Table ──
  html += '<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;overflow:auto;">';
  html += '<table style="border-collapse:collapse;width:100%;table-layout:fixed;">';
  html += '<thead><tr>';
  html += '<th style="text-align:right;padding-right:10px;width:110px;background:#f8fafc;border:1px solid #e2e8f0;font-size:11px;font-weight:700;color:#64748b;padding:8px 10px;">מתקין</th>';
  DAYS.forEach(function(d, i) {
    var tod = isToday(dates[i]);
    html += '<th style="text-align:center;padding:8px 4px;background:'+(tod?'#eff6ff':'#f8fafc')+';border:1px solid #e2e8f0;font-size:10px;font-weight:700;color:'+(tod?'#2563eb':'#64748b')+';width:calc((100%-110px)/6);">' +
      d + '<br><span style="font-weight:400;font-size:9px;">' + fmtDate(dates[i]) + '</span></th>';
  });
  html += '</tr></thead><tbody>';

  INSTALLERS.forEach(function(inst) {
    var av = inst.name.replace(/\s/g,"").substring(0,2);
    html += '<tr>';
    html += '<td style="border:1px solid #e2e8f0;padding:8px;background:#f8fafc;vertical-align:middle;">' +
      '<div style="display:flex;align-items:center;gap:6px;">' +
      '<div style="width:26px;height:26px;border-radius:50%;background:#eff6ff;color:#2563eb;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #bfdbfe;">'+av+'</div>' +
      '<div><div style="font-size:12px;font-weight:700;">'+inst.name+'</div><div style="font-size:9px;color:#94a3b8;">'+inst.phone+'</div></div>' +
      '</div></td>';
    dates.forEach(function(date, di) {
      var key = offKey(inst.name, isoDate(date));
      var reason = offDays[key];
      var offColors = {'חופש':'#2563eb','חג':'#7c3aed','מחלה':'#dc2626','אירוע אישי':'#d97706','הכשרה':'#16a34a'};
      var offIcons = {'חופש':'🏖','חג':'✡','מחלה':'🤒','אירוע אישי':'🎉','הכשרה':'📚'};
      var hasChips = (chips[cellKey(inst.name,di)]||[]).length > 0;
      var tod = isToday(date);
      if (reason) {
        var oc = offColors[reason]||'#64748b';
        var oi = offIcons[reason]||'❌';
        html += '<td style="border:1px solid #e2e8f0;padding:4px;text-align:center;background:'+oc+'0d;">' +
          '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">' +
          '<span style="font-size:16px;">'+oi+'</span>' +
          '<span style="font-size:10px;font-weight:700;color:'+oc+';">'+reason+'</span>' +
          '<button class="abs-remove-btn" data-inst="'+inst.name+'" data-date="'+isoDate(date)+'" style="font-size:9px;border:1px solid '+oc+'40;background:#fff;border-radius:4px;padding:1px 6px;cursor:pointer;color:'+oc+';margin-top:2px;">הסר</button>' +
          '</div></td>';
      } else {
        html += '<td style="border:1px solid #e2e8f0;padding:4px;text-align:center;background:'+(tod?'#f0f7ff':'#fff')+(hasChips?';outline:2px solid #2563eb30;outline-offset:-2px':'')+';cursor:pointer;" class="abs-add-cell" data-inst="'+inst.name+'" data-datefmt="'+fmtDate(date)+'" data-date="'+isoDate(date)+'" title="לחץ להוספת היעדרות">' +
          (hasChips ? '<span style="font-size:9px;font-weight:700;color:#2563eb;display:block;margin-bottom:2px;">משובץ</span>' : '') +
          '<span style="font-size:18px;color:#e2e8f0;display:block;">+</span>' +
          '</td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // ── Summary of all off days ──
  var allOff = Object.keys(offDays);
  if (allOff.length) {
    html += '<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:14px 16px;">';
    html += '<div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;">כל ההיעדרויות הרשומות</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px;">';
    allOff.sort().forEach(function(k) {
      var parts = k.split("__");
      var instName = parts[0]; var isoD = parts[1];
      var reason = offDays[k];
      var offColors = {'חופש':'#2563eb','חג':'#7c3aed','מחלה':'#dc2626','אירוע אישי':'#d97706','הכשרה':'#16a34a'};
      var oc = offColors[reason]||'#64748b';
      html += '<div style="display:flex;align-items:center;gap:6px;background:'+oc+'0d;border:1px solid '+oc+'30;border-radius:6px;padding:5px 10px;">' +
        '<span style="font-size:11px;font-weight:700;color:'+oc+';">'+instName+'</span>' +
        '<span style="font-size:10px;color:#94a3b8;">'+isoD+'</span>' +
        '<span style="font-size:10px;font-weight:600;color:'+oc+';">'+reason+'</span>' +
        '<button class="abs-remove-btn" data-inst="'+instName+'" data-date="'+isoD+'" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:12px;padding:0 0 0 4px;">✕</button>' +
        '</div>';
    });
    html += '</div></div>';
  }
  html += '</div>';
  area.innerHTML = html;
}

function openAddAbsence() {
  // open off modal without pre-selected installer
  offInst = null; offIsoDate = null;
  // populate installer select
  document.getElementById("off-inst-select").innerHTML = INSTALLERS.map(function(i){
    return '<option value="'+i.name+'">'+i.name+'</option>';
  }).join("");
  // populate date select with current week
  var dates = weekDates(weekOffset);
  document.getElementById("off-date-select").innerHTML = dates.map(function(d,i){
    return '<option value="'+isoDate(d)+'">'+DAYS[i]+' '+fmtDate(d)+'</option>';
  }).join("");
  document.getElementById("off-av").textContent = INSTALLERS[0].name.replace(/\s/g,"").substring(0,2);
  document.getElementById("off-inst-lbl").textContent = INSTALLERS[0].name;
  document.getElementById("off-date-lbl").textContent = "בחר תאריך";
  document.getElementById("off-reason").value = "חופש";
  document.querySelectorAll(".off-reason-btn").forEach(function(b){ b.classList.remove("selected"); });
  var first = document.querySelector(".off-reason-btn");
  if (first) first.classList.add("selected");
  document.getElementById("off-modal").classList.add("open");
}

function quickAddOff(instName, dateLabel, isoD) {
  offInst = instName; offIsoDate = isoD;
  var av = instName.replace(/\s/g,"").substring(0,2);
  document.getElementById("off-av").textContent = av;
  document.getElementById("off-inst-lbl").textContent = instName;
  document.getElementById("off-date-lbl").textContent = "יום " + dateLabel;
  // hide selects, show labels
  if (document.getElementById("off-inst-select")) document.getElementById("off-inst-select").style.display = "none";
  if (document.getElementById("off-date-select")) document.getElementById("off-date-select").style.display = "none";
  document.getElementById("off-reason").value = "חופש";
  document.querySelectorAll(".off-reason-btn").forEach(function(b){ b.classList.remove("selected"); });
  var first = document.querySelector(".off-reason-btn");
  if (first) first.classList.add("selected");
  document.getElementById("off-modal").classList.add("open");
}

function renderStats() {
  var dates = weekDates(weekOffset);
  var all = allChips();
  var thisW = all.filter(function(c){ return c.wk===weekOffset; });
  var totalD = all.reduce(function(s,c){ return s+c.days; }, 0);
  var thisWD = thisW.reduce(function(s,c){ return s+c.days; }, 0);
  var instD = {}; INSTALLERS.forEach(function(i){ instD[i.name]=0; });
  all.forEach(function(c){ if (instD[c.inst]!==undefined) instD[c.inst]+=c.days; });
  var typeD = {}; TYPES.forEach(function(t){ typeD[t.id]=0; });
  all.forEach(function(c){ if (typeD[c.type]!==undefined) typeD[c.type]+=c.days; });
  var projD = {}; all.forEach(function(c){ projD[c.proj]=(projD[c.proj]||0)+c.days; });
  var topP = Object.keys(projD).map(function(k){ return [k,projD[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,7);
  var maxI = Math.max.apply(null, Object.keys(instD).map(function(k){ return instD[k]; }).concat([1]));
  var openD = dreshyot.filter(function(d){ return d.status==="פתוח"; }).length;
  var doneD = dreshyot.filter(function(d){ return d.status==="שובץ"; }).length;
  var area = document.getElementById("main-area");
  area.innerHTML =
    '<div class="stats-view">' +
    '<div class="kpi-row">' +
    '<div class="kpi-card" style="--kc:#2563eb"><div class="kpi-label">ימי התקנה סה"כ</div><div class="kpi-value">'+totalD+'</div></div>' +
    '<div class="kpi-card" style="--kc:#7c3aed"><div class="kpi-label">ימי עבודה השבוע</div><div class="kpi-value">'+thisWD+'</div><div class="kpi-sub">'+fmtDate(dates[0])+' - '+fmtDate(dates[5])+'</div></div>' +
    '<div class="kpi-card" style="--kc:#d97706"><div class="kpi-label">דרישות פתוחות</div><div class="kpi-value" style="color:#d97706">'+openD+'</div></div>' +
    '<div class="kpi-card" style="--kc:#16a34a"><div class="kpi-label">שיבוצים הושלמו</div><div class="kpi-value" style="color:#16a34a">'+doneD+'</div></div>' +
    '</div>' +
    '<div class="chart-row">' +
    '<div class="chart-card"><div class="chart-title">עומס מתקינים</div>' +
    INSTALLERS.map(function(i){ var pct=Math.round((instD[i.name]||0)/maxI*100); return '<div class="bar-row"><div class="bar-label" title="'+i.name+'">'+i.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:#2563eb;"></div></div><div class="bar-value">'+(instD[i.name]||0)+'</div></div>'; }).join("") +
    '</div>' +
    '<div class="chart-card"><div class="chart-title">ימי עבודה לפי סוג</div>' +
    TYPES.map(function(t){ var v=typeD[t.id]||0; var maxT=Math.max.apply(null,TYPES.map(function(x){ return typeD[x.id]||0; }).concat([1])); return '<div class="bar-row"><div class="bar-label">'+t.label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(v/maxT*100)+'%;background:'+t.color+';"></div></div><div class="bar-value">'+v+'</div></div>'; }).join("") +
    '<div style="margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0;"><div class="chart-title">טופ פרויקטים</div>' +
    topP.map(function(p){ var maxPV=topP[0]?topP[0][1]:1; return '<div class="bar-row"><div class="bar-label" title="'+p[0]+'">'+p[0].substring(0,13)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(p[1]/maxPV*100)+'%;background:#16a34a;"></div></div><div class="bar-value">'+p[1]+'</div></div>'; }).join("") +
    '</div></div>' +
    '</div></div>';
}

// ==================== ADD INSTALLER ====================
function addInstaller() {
  var name = prompt("שם המתקין:");
  if (!name || !name.trim()) return;
  var phone = prompt("טלפון:", "");
  var city = prompt("עיר:", "");
  var skill = prompt("מיומנות (מחיצות/זיגוג/פרופילציה/כללי):", "כללי");
  INSTALLERS.push({id:"li"+nextId++, name:name.trim(), phone:phone||"", city:city||"", skill:skill||"כללי"});
  saveData(); renderAll(); notify("מתקין נוסף", "ok");
}
